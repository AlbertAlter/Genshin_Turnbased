<title>战斗角色详情</title>
<link rel="stylesheet" href="battle-character-detail.css">
<script defer src="battle-character-detail.js"></script>

<body>
<main class="battle-viewport" aria-label="战斗画面">
  <div class="arena" id="arena">
    <div class="enemy-hud" id="enemy-hud" aria-hidden="true"></div>
    <div id="enemies" aria-hidden="true"></div>
    <div id="allies"></div>
    <div class="battle-party" id="battle-party"></div>
    <div class="battle-controls" id="battle-controls" aria-hidden="true"></div>
  </div>
</main>

<dialog id="character-page" aria-labelledby="character-name" autofocus>
  <div class="character-layout">
    <aside class="character-side">
      <div class="side-caption"><span class="diamond" aria-hidden="true"></span><span data-copy="title">角色详情</span></div>
      <div class="portrait" id="portrait"></div>
      <div class="identity" id="identity"></div>
      <div class="party-switch" id="party-switch" role="group" aria-label="切换队伍角色"></div>
    </aside>
    <section class="character-content">
      <header class="top">
        <div class="tabs" id="tabs" role="tablist" aria-label="角色详情"></div>
        <form method="dialog">
          <button class="close" id="close" value="close" type="submit" aria-label="关闭">×</button>
        </form>
      </header>
      <div id="panels"></div>
    </section>
  </div>
</dialog>
