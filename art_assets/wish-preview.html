    function writeResultTitle() {
      const { pool, count } = session;
      const draw = count === 1 ? text("单次祈愿", "Single Wish") : text("十次祈愿", "Ten Wishes");
      byId("result-pool").textContent = `${poolName(pool)} · ${draw}`;
    }

    function showResults(count) {
      if (!hostVisible || pendingDraw || session?.playing || !infoView.hidden || balance < count) return;
      const pool = session?.pool ?? pools[activePool];
      const states = structuredClone(pityByType), copies = new Map(characterCopies);
      const rewards = Array.from({length: count}, () => drawReward(pool,wishRandom,states));
      const batch = {pool,count,rewards,states,copies,currencies:countCurrencies(rewards,copies)};
      if (window.parent === window) revealBatch(batch,balance-count);
      else {
        pendingDraw = {...batch,id:++drawSequence};
        updateBalance();
        window.parent.postMessage({type:"wish-preview-draw",request:hostRequest,draw:pendingDraw.id,count,balance},"*");
      }
    }

    function revealBatch({pool,count,rewards,states,copies,currencies}, remaining) {
      const drawnAt = new Date();
      balance = remaining;
      pityByType = states;
      characterCopies = copies;
      byId("wish-save-error").hidden = true;
      for (const reward of rewards) {
        history.push({ reward, pool, drawnAt });
      }
      poolView.hidden = true;
      resultView.hidden = false;
      updateBalance();
      skipButton.hidden = false;
      returnButton.hidden = true;
      byId("result-currencies").hidden = true;
      byId("result-footer").append(drawActions);

      resultGrid.classList.toggle("single", count === 1);
      resultGrid.innerHTML = rewards.map(makeSlot).join("");
      session = {
        pool, count, rewards, currencies, finished: 0, sparkles: [], playing: true, openedAt: performance.now(),
        slots: [...resultGrid.children].map((node, index) => ({
          node, reward: rewards[index], cover: node.querySelector(".back-cover"),
          mask: node.querySelector(".back-mask"), start: (count === 1 ? 490 : 630) + index * 150
        }))
      };
      writeResultTitle();
      if (motion.matches) finishAll();
      else { skipButton.focus({preventScroll: true}); frame = requestAnimationFrame(tick); }
    }

    function beginReveal(slot, elapsed) {
      const rect = slot.cover.getBoundingClientRect();
      const base = app.getBoundingClientRect();
      slot.x = (rect.left - base.left) / fit;
      slot.y = (rect.top - base.top) / fit;
      slot.w = Math.round(rect.width / fit);
      slot.h = Math.round(rect.height / fit);
      slot.duration = slot.reward.stars === 5 ? 550 : 410;
      slot.cursor = 0;
      slot.node.classList.add("revealing");
      if (slot.reward.stars === 5) {
        slot.node.classList.add("flaring");
        slot.goldUntil = elapsed + 820;
      }
      if (!backTexture.complete || !backTexture.naturalWidth) return;
      slot.mask.width = slot.w;
      slot.mask.height = slot.h;
      slot.paint = slot.mask.getContext("2d");
      if (!slot.paint) return;
      slot.paint.drawImage(backTexture, 0, 0, slot.w, slot.h);
      slot.mask.hidden = false;
      slot.cover.hidden = true;
      const unit = session.count === 1 ? 5 : 4;
      slot.cells = [];
      for (let y = 0; y < slot.h; y += unit) {
        for (let x = 0; x < slot.w; x += unit) {
          const edge = .57 * (x / slot.w) + .43 * (1 - y / slot.h);
          slot.cells.push({x, y, threshold: .86 * edge + Math.random() * .14});
        }
      }
      slot.cells.sort((a, b) => a.threshold - b.threshold);
      slot.unit = unit;
    }

    function scatter(slot, cell, elapsed) {
      const colors = palette[slot.reward.stars];
      session.sparkles.push({
        x: slot.x + cell.x, y: slot.y + cell.y, t: elapsed,
        duration: 240 + Math.random() * 330, dx: 15 + Math.random() * 60,
        dy: -(18 + Math.random() * 67), size: 1.2 + Math.random() * 3.3,
        color: colors[Math.floor(Math.random() * colors.length)]
      });
    }

    function finishSlot(slot) {
      if (slot.done) return;
      slot.done = true;
      slot.node.classList.remove("revealing");
      slot.node.classList.add("revealed", "settled");
      slot.cover.hidden = true;
      slot.mask.hidden = true;
      slot.node.setAttribute("aria-label", revealedSlotLabel(slot.reward));
      session.finished++;
    }

    function animateSlot(slot, elapsed) {
      if (slot.done || elapsed < slot.start) return;
      if (!slot.duration) beginReveal(slot, elapsed);
      const progress = Math.min(1, (elapsed - slot.start) / slot.duration);
      if (slot.paint) {
        while (slot.cursor < slot.cells.length && slot.cells[slot.cursor].threshold <= progress) {
          const cell = slot.cells[slot.cursor++];
          slot.paint.clearRect(cell.x, cell.y, slot.unit, slot.unit);
          if (Math.random() < (slot.reward.stars === 5 ? .034 : .019)) scatter(slot, cell, elapsed);
        }
      } else {
        slot.cover.style.opacity = String(1 - progress);
      }
      if (progress === 1) finishSlot(slot);
    }

    function drawLight(x, y, size, color, opacity) {
      ctx.globalAlpha = opacity;
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(x, y - size * 1.7);
      ctx.lineTo(x + size * .85, y);
      ctx.lineTo(x, y + size * 1.7);
      ctx.lineTo(x - size * .85, y);
      ctx.closePath();
      ctx.fill();
    }

    function paintEffects(elapsed) {
      if (!ctx) return;
      ctx.clearRect(0, 0, W, H);
      const sparks = session.sparkles;
      session.sparkles = sparks.filter((spark) => elapsed - spark.t < spark.duration);
      for (const spark of session.sparkles) {
        const p = (elapsed - spark.t) / spark.duration;
        drawLight(spark.x + spark.dx * p, spark.y + spark.dy * p, spark.size * (1 - .6 * p), spark.color, .76 * (1 - p));
      }
      for (const slot of session.slots) {
        if (!slot.goldUntil || elapsed >= slot.goldUntil) continue;
        const p = 1 - (slot.goldUntil - elapsed) / 820;
        const colors = palette[5];
        for (let i = 0; i < 13; i++) {
          const angle = i * Math.PI * 2 / 13 + p * 1.85;
          const spread = 1 + p * .20 + (i % 3) * .033;
          const x = slot.x + slot.w / 2 + Math.cos(angle) * slot.w * .57 * spread;
          const y = slot.y + slot.h / 2 + Math.sin(angle) * slot.h * .51 * spread;
          drawLight(x, y, 1.3 + i % 4, colors[i % colors.length], .88 * Math.sin(Math.PI * p));
        }
      }
      ctx.globalAlpha = 1;
    }

    function tick(now) {
      if (!session?.playing) return;
      const elapsed = now - session.openedAt;
      session.slots.forEach((slot) => animateSlot(slot, elapsed));
      paintEffects(elapsed);
      if (session.finished === session.count && elapsed >= session.slots.at(-1).start + 850) finishAll();
      else frame = requestAnimationFrame(tick);
    }

    function finishAll() {
      if (!session?.playing) return;
      session.playing = false;
      cancelAnimationFrame(frame);
      ctx?.clearRect(0, 0, W, H);
      for (const slot of session.slots) {
        finishSlot(slot);
        slot.node.disabled = false;
        slot.node.classList.remove("flaring");
      }
      skipButton.hidden = true;
      showResultCurrencies(session.currencies);
      returnButton.hidden = false;
      drawActions.hidden = false;
      returnButton.focus({preventScroll: true});
    }

    function returnToPool(restoreFocus = true) {
      if (!session || session.playing) return;
      session = null;
      resultGrid.replaceChildren();
      resultView.hidden = true;
      poolView.hidden = false;

    const detailTabs = [
      ["stats", "属性", "Attributes"], ["skills", "技能", "Skills"],
      ["talents", "天赋", "Talents"], ["constellations", "命座", "Constellations"]
    ];
    const detailStatNames = {
      BaseHP: ["基础生命值", "Base HP"], BaseATK: ["基础攻击力", "Base ATK"],
      BaseDEF: ["基础防御力", "Base DEF"], BaseEM: ["元素精通", "Elemental Mastery"],
      BaseRechargeRate: ["元素充能效率", "Energy Recharge", true], CritRate: ["暴击率", "CRIT Rate", true],
      CritDMG: ["暴击伤害", "CRIT DMG", true], ATKBonus: ["攻击力", "ATK", true],
      HPBonus: ["生命值上限", "HP", true], RechargeBonus: ["元素充能效率", "Energy Recharge", true],
      PhysicalDMGBonus: ["物理伤害加成", "Physical DMG Bonus", true], WeaponEM: ["元素精通", "Elemental Mastery"],
      DEFBonus: ["防御力", "DEF", true]
    };
    const detailNations = {蒙德: "Mondstadt", 璃月: "Liyue", 稻妻: "Inazuma", 须弥: "Sumeru", 枫丹: "Fontaine", 纳塔: "Natlan",
      挪德卡莱: "Nod-Krai", 至冬: "Snezhnaya", 无归属: "Unaffiliated"};
    const escapeDetail = value => String(value ?? "").replace(/[&<>"']/g, character =>
      ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[character]);

    function formatDetailText(value) {
      const formatLine = line => line.split(/(#[0-8][^#]+#)/g).map(part => {
        const color = /^#([0-8])([^#]+)#$/.exec(part);
        return color ? `<span class="detail-color" style="color:${detailData.colors[color[1]]}">${escapeDetail(color[2])}</span>` :
          escapeDetail(part);
      }).join("");
      return value.split(/(?:\\n|\r?\n){2,}/).map(paragraph => {
        const [first, ...rest] = paragraph.split(/\\n|\r?\n/);
        if (rest.length && /^#[1-8][^#]+#$/.test(first))
          return `<div class="detail-status"><strong>${formatLine(first)}</strong><p>${rest.map(formatLine).join("<br>")}</p></div>`;
        return `<p>${[first, ...rest].map(formatLine).join("<br>")}</p>`;
      }).join("");
    }

    function detailStatRows(stats) {
      return `<dl class="detail-stats">${Object.entries(stats).map(([key, value]) => {
        const [label, translated, percent] = detailStatNames[key];
        const display = percent ? (value * 100).toFixed(1) + "%" : value.toLocaleString(text("zh-CN", "en-US"));
        return `<div><dt>${text(label, translated)}</dt><dd>${display}</dd></div>`;
      }).join("")}</dl>`;
    }

    function detailEntry(entry, subtitle) {
      return `<article class="detail-entry"><div class="detail-entry-head">
        ${entry.icon ? `<img src="${escapeDetail(entry.icon)}" alt="">` : ""}
        <div><h3>${escapeDetail(text(...entry.name))}</h3><small>${escapeDetail(subtitle)}</small></div>
      </div><div class="detail-text">${formatDetailText(text(...entry.description))}</div></article>`;
    }

    function characterDetailPanel(profile) {
      if (detailTab === "stats")
        return `<h3 class="detail-section-title">${text("Lv. 1 基础属性", "Lv. 1 Base Attributes")}</h3>${detailStatRows(profile.stats)}`;
      const skills = [["普攻", "Normal Attack"], ["重击", "Heavy Attack"], ["元素战技", "Elemental Skill"], ["元素爆发", "Elemental Burst"]];
      return profile[detailTab].map((entry, index) => {
        if (detailTab === "skills") return detailEntry(entry, text(...skills[index]) + " · Lv. 1");
        if (detailTab === "constellations") return detailEntry(entry, text(`命之座 ${entry.index}`, `Constellation ${entry.index}`));
        const unlock = entry.threshold ? text(`达到 Lv. ${entry.threshold} 并突破后解锁`, `Unlocks after ascending at Lv. ${entry.threshold}`) :
          text("固有天赋", "Innate Talent");
        return detailEntry(entry, unlock);
      }).join("");
    }

    function renderModal() {
      const item = modalItem;
      const profile = detailData.characters[item.id], weaponInfo = detailData.weapons[item.id];
      const meta = [kindName(item.type), elementName(item.element), weaponTypeName(item.weaponType)].filter(Boolean);
      if (item.nation) meta.push(text(item.nation, detailNations[item.nation] ?? item.nation));
      const tabBar = profile ? `<div class="detail-tabs" role="tablist" aria-label="${text("角色详情", "Character details")}">

          id="detail-tab-${id}" aria-controls="detail-panel" data-detail-tab="${id}"

        </header>

    function toggleLanguage() {
      english = !english;
      document.documentElement.lang = text("zh-CN", "en");
      document.title = text("祈愿", "Wish");
      languageButton.textContent = text("EN", "中文");
      languageButton.lang = text("en", "zh-CN");
      languageButton.setAttribute("aria-label", text("Switch to English", "切换到中文"));
      for (const [node, chinese, translated] of translatedText) node.textContent = text(chinese, translated);
      for (const [node, attr, chinese, translated] of translatedAttributes)
        node.setAttribute(attr, text(chinese, translated));
      renderPeriodControls();
      if (!poolView.hidden) renderPool(true);
      if (!infoView.hidden) renderInfo(true);
      if (session) {
        writeResultTitle();
        session.slots.forEach(({node, reward, done}, index) => {
          node.setAttribute("aria-label", done ? revealedSlotLabel(reward) : waitingSlotLabel(index));

    app.addEventListener("click", ({target}) => {
      if (target === modalLayer) { closeModal(); return; }
      const button = target.closest("button");
      if (!button || button.disabled) return;
      if (button === themeButton) {
        if (gestureRequired) gestureRequired = false;
        else musicEnabled = !musicEnabled;
        syncTheme();
      }
      else if (button.hasAttribute("data-close")) closeModal();
      else if (button.hasAttribute("data-info")) openInfo(button.dataset.info, button);
      else if (button === infoBack) closeInfo();
      else if (button.hasAttribute("data-featured-scroll")) scrollFeatured(button);
      else if (button.hasAttribute("data-history-kind")) {
        historyKind = button.dataset.historyKind;
        historyPage = 0;
        renderHistory();
      } else if (button.hasAttribute("data-history-page")) {
        historyPage += Number(button.dataset.historyPage);
        renderHistory();
      } else if (button.hasAttribute("data-pool")) {
        activePool = button.dataset.pool;
        if (infoView.hidden) {
          renderPool();
          tabs.querySelector('[aria-pressed="true"]').focus({preventScroll: true});
        } else {
          renderInfo();
          syncTheme();
          probabilityBody.querySelector('.probability-pool-tabs [aria-pressed="true"]').focus({preventScroll: true});
        }
      } else if (button.hasAttribute("data-draw")) showResults(Number(button.dataset.draw));
      else if (button === skipButton) finishAll();
      else if (button === returnButton) returnToPool();
      else if (button.hasAttribute("data-detail-tab")) selectDetailTab(button);
      else if (button.hasAttribute("data-detail-id")) {
        const item = detailItems.get(Number(button.dataset.detailId));
        if (item) openModal(item, button);
      }
      else if (button.hasAttribute("data-slot") && session) {
        const item = session.rewards[Number(button.dataset.slot)];
        openModal(item, button);
      }
    });
    app.addEventListener("click", event => {
      if (!event.isTrusted || !gestureRequired) return;
      gestureRequired = false;
      syncTheme();
    });
    app.addEventListener("keydown", (event) => {
      if (!modalLayer.hidden && event.key === "Tab") {
        const stops = [...modal.querySelectorAll('button:not([tabindex="-1"]), #detail-panel')];
        const first = stops[0], last = stops.at(-1);
        if (event.shiftKey && document.activeElement === first) {
          last.focus();
          event.preventDefault();
        } else if (!event.shiftKey && document.activeElement === last) {
          first.focus();
          event.preventDefault();
        }
      }
      if (event.target.matches("[data-detail-tab]") && ["ArrowLeft", "ArrowRight", "Home", "End"].includes(event.key)) {
        const buttons = [...modal.querySelectorAll("[data-detail-tab]")];
        const current = buttons.indexOf(event.target);
        const next = event.key === "Home" ? 0 : event.key === "End" ? buttons.length - 1 :
          (current + (event.key === "ArrowRight" ? 1 : -1) + buttons.length) % buttons.length;
        selectDetailTab(buttons[next]);
        buttons[next].focus();
        event.preventDefault();
        return;
      }
      if (event.key !== "Escape") return;
      if (!modalLayer.hidden) closeModal();
      else if (!infoView.hidden) closeInfo();
      else if (session?.playing) finishAll();
      else if (session) returnToPool();
      else if (!byId("return-to-route").hidden) byId("return-to-route").click();
      else return;
      event.preventDefault();
    });

    versionSelect.replaceChildren(...Array.from(phasesByVersion.keys(), version => new Option(version, version)));
    languageButton.addEventListener("click", toggleLanguage);
    versionSelect.addEventListener("change", () => selectPhase(phasesByVersion.get(versionSelect.value)[0]));
    periodOptions.addEventListener("click", ({target}) => {
      const button = target.closest("[data-phase]");
      if (!button) return;
      selectPhase(button.dataset.phase);
      periodOptions.querySelector('[aria-pressed="true"]').focus({preventScroll: true});
    });
    renderPeriodControls();
    renderPool();
  })();
  </script>
</body>
</html>
