  <style>
    :root {
      color-scheme: light;
      --light-brown: #998F81;
      --dark-brown: #716758;
      --button-white: #fefefe;
      --paper: #f7efdd;
      --gold: #efcf8d;
      --ink: #352d25;
      --secondary: #3a3129;
      --line: #352d2555;
      --pool-detail-width: 696px; /* Five 128px weapon cards and four 14px gaps. */
      --frame: url("Character_Bare/Frame/01.png");
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body { margin: 0; background: var(--dark-brown); color: var(--ink); font: 21px/1.5 ProjectFont, "Microsoft YaHei", sans-serif; }
    h1, h2, h3, p { margin: 0; }
    button { font: inherit; color: inherit; cursor: pointer; }
    button:disabled { cursor: default; }
    button:focus-visible { outline: 2px solid var(--dark-brown); outline-offset: 4px; }
    .poster button:focus-visible { outline-color: var(--button-white); }
    [hidden] { display: none !important; }
    body { display: grid; grid-template-rows: auto minmax(0, 1fr); }
    .period-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 48px;
      padding: 6px 16px;
      overflow-x: auto;
      background: var(--ink);
      color: var(--paper);
      font-size: 15px;
      white-space: nowrap;
    }
    .period-controls select, .period-controls button {
      min-height: 32px;
      padding: 3px 12px;
      border: 1px solid var(--light-brown);
      border-radius: 6px;
      background: var(--dark-brown);
      color: var(--paper);
      font: inherit;
    }
    .period-controls :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
    .period-controls button[aria-pressed="true"] { background: var(--paper); color: var(--ink); }
    .period-options { display: flex; gap: 6px; }
    .preview-stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
    .app {
      position: absolute;
      inset: 50% auto auto 50%;
      width: 1920px;
      height: 1080px;
      transform: translate(-50%, -50%) scale(var(--fit, 1));
      overflow: hidden;
      isolation: isolate;
      background: radial-gradient(ellipse at 70% 38%, #c8bcab88, transparent 70%), var(--light-brown);
    }
    .app::before {
      content: "";
      position: absolute;
      inset: 24px 30px;
      pointer-events: none;
      border: 1px solid #71675866;
      border-radius: 14px;
    }
    .view { position: absolute; inset: 0; }
    .masthead {
      --masthead-padding-bottom: 16px;
      position: absolute;
      top: 43px;
      left: 92px;
      right: 92px;
      min-height: 66px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--line);
      padding: 0 153px var(--masthead-padding-bottom) 0;
    }
    .title, .balance, .actions { display: flex; align-items: center; gap: 18px; }
    .title h1, .title h2 { font-size: 32px; line-height: 1.2; }
    .title .tagline { color: var(--secondary); font-size: 15px; margin-top: 3px; letter-spacing: .10em; }
    .mark { position: relative; width: 47px; height: 47px; display: grid; place-items: center; flex: none; color: var(--ink); font-size: 31px; }
    .mark::before { content: ""; position: absolute; inset: 5px; border: 1px solid var(--dark-brown); transform: rotate(45deg); border-radius: 3px; }
    .balance {
      position: absolute;
      top: calc((100% - var(--masthead-padding-bottom)) / 2);
      right: 0;
      transform: translateY(-50%);
      z-index: 5;
      width: 135px;
      background: var(--dark-brown);
      border: 1px solid var(--light-brown);
      border-radius: 26px;
      min-height: 48px;
      padding: 5px 19px;
      gap: 12px;
      color: var(--button-white);
      box-shadow: inset 0 0 0 2px #fefefe36, 0 2px 6px #352d2540;
      font-size: 16px;
    }
    .balance img { width: 30px; height: 30px; object-fit: contain; }
    .balance output { font-size: 23px; width: 3.3ch; flex: none; text-align: start; font-variant-numeric: tabular-nums; }
    .wish-button {
      --button-fill: var(--light-brown);
      --button-text: #29241e;
      --button-border: var(--dark-brown);
      --button-divider: #29241e55;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-height: 48px;
      padding: 6px 19px;
      border: 1px solid var(--button-border);
      border-radius: 999px;
      background-color: var(--button-fill);
      box-shadow: inset 0 0 0 2px #fefefe36, 0 2px 6px #352d2540;
      color: var(--button-text);
      font-size: 18px;
      font-weight: 400;
      line-height: 1.2;
      white-space: nowrap;
    }
    .wish-button.emphasis, .wish-button[aria-pressed="true"] {
      --button-fill: var(--dark-brown);
      --button-text: var(--button-white);
      --button-border: var(--light-brown);
      --button-divider: #fefefe55;
    }
    .wish-button:hover:enabled { background-image: linear-gradient(#fefefe14, #fefefe14); }
    .wish-button:active:enabled { box-shadow: inset 0 0 0 2px #fefefe36, inset 0 2px 5px #352d2559; }
    .wish-button:disabled { opacity: .55; box-shadow: inset 0 0 0 2px #fefefe36; }
    .period-controls .language-switch { margin-inline-start: auto; min-width: 76px; }
    .button-icons { position: absolute; width: 0; height: 0; overflow: hidden; }
    .button-icon {
      display: block;
      width: 21px;
      height: 21px;
      flex: none;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
    }
    .wish-tools { gap: 10px; }
    .theme-controls, .theme-level { display: flex; align-items: center; gap: 8px; }
    .theme-button { min-width: 48px; padding-inline: 10px; }
    .theme-button[aria-pressed="true"] .mute-mark { display: none; }
    .theme-level { padding-inline: 3px 8px; color: var(--dark-brown); }
    .theme-level input { width: 88px; margin: 0; accent-color: var(--dark-brown); }
    .theme-level output { width: 4ch; text-align: right; font-size: 16px; font-variant-numeric: tabular-nums; }

<body>

en#\\nCovers 3 adjacent enemy positions for 5 turns. Enemies in those positions deal 10% less DMG.\\nThe entire screen shares 6 protection charges. An enemy in its area consumes 1 charge after completing an attack that actually hits an ally. It is destroyed when charges run out and disappears normally when its duration ends.\\nRecasting the Skill relocates it and restores its charges and duration without counting as destruction. While it exists, Ningguang's Burst launches 6 additional bouncing attacks that deal #6Geo# DMG. The Burst does not consume or destroy the screen."],"icon":"Skill_Icon/1017/1017_S01.png"},{"name":["天权崩玉","Starshatter"],"description":["发动6次弹射攻击，每次对一名随机敌人造成相当于87.0%攻击力的#6岩元素伤害#。#8璇玑屏#存在时，额外弹射6次。\\n消耗40点元素能量，冷却3回合。\\n\\n#8璇玑屏#\\n覆盖三个相邻的敌方位置，持续5回合。位于覆盖位置的敌人造成的伤害降低10%。\\n整面屏共用6次抵御次数。来自覆盖位置的敌人一次完整攻击实际命中我方后，消耗1次。次数耗尽时屏被摧毁，自然到期时正常消失。\\n重新施放战技会更新位置、恢复次数和持续时间，不算屏被摧毁。屏存在时，凝光爆发额外发动6次#6岩元素#弹射攻击。爆发不会消耗或摧毁屏。","Launches 6 bouncing attacks, each dealing 87.0% ATK as #6Geo DMG# to a random enemy. Bounces 6 more times if a #8Jade Screen# is present.\\nCosts 40 Energy, 3-turn cooldown.\\n\\n#8Jade Screen#\\nCovers 3 adjacent enemy positions for 5 turns. Enemies in those positions deal 10% less DMG.\\nThe entire screen shares 6 protection charges. An enemy in its area consumes 1 charge after completing an attack that actually hits an ally. It is destroyed when charges run out and disappears normally when its duration ends.\\nRecasting the Skill relocates it and restores its charges and duration without counting as destruction. While it exists, Ningguang's Burst launches 6 additional bouncing attacks that deal #6Geo# DMG. The Burst does not consume or destroy the screen."],"icon":"Skill_Icon/1017/1017_S02.png"}],"talents":[{"name":["星移势转","Backup Plan"],"description":["拥有#8星璇#时，凝光的重击不消耗AP。","Ningguang's Heavy Attack costs no AP while she holds Star Jades. The jades are still consumed when the attack is released."],"icon":"Skill_Icon/1017/1017_T01.png","threshold":20},{"name":["储之千日，用之一刻","Strategic Reserve"],"description":["施放#8璇玑屏#后，我方全体获得12%#6岩元素伤害加成#，持续2回合。","Casting #8Jade Screen# grants all allies 12% #6Geo DMG Bonus# for 2 turns."],"icon":"Skill_Icon/1017/1017_T02.png","threshold":60}],"constellations":[{"name":["悬星尽散击云碎","Piercing Fragments"],"description":["普通攻击对三个相邻位置上的敌人同时造成伤害。","Normal Attacks deal damage to 3 adjacent targets."],"icon":"Skill_Icon/1017/1017_C01.png","index":1},{"name":["璇玑合璧镇昆仑","Shock Effect"],"description":["#8璇玑屏#因抵御攻击次数耗尽而碎裂时，清除#8璇玑屏#的冷却时间。该效果每2回合至多触发一次。","When #8Jade Screen# breaks because its protection charges run out, resets its cooldown. Can trigger once every 2 turns."],"icon":"Skill_Icon/1017/1017_C02.png","index":2},{"name":["星罗宿列天权临","Majesty Be the Array of Stars"],"description":["天权崩玉的技能等级提高3级，最高15级。","Increases the level of Starshatter by 3, up to Level 15."],"icon":"Skill_Icon/1017/1017_C03.png","index":3},{"name":["攻守易形著神机","Exquisite be the Jade, Outshining All Beneath"],"description":["#8璇玑屏#存在时，我方所有角色的所有元素抗性提升10%。","While #8Jade Screen# exists, all allies gain 10% All Elemental RES."],"icon":"Skill_Icon/1017/1017_C04.png","index":4},{"name":["琼屏千扇正天衡","Invincible Be the Jade Screen"],"description":["#8璇玑屏#的技能等级提高3级，最高15级。","Increases the level of #8Jade Screen# by 3, up to Level 15."],"icon":"Skill_Icon/1017/1017_C05.png","index":5},{"name":["七星璨璨凝流光","Grandeur Be the Seven Stars"],"description":["施放天权崩玉时，凝光持有的#8星璇#数量变为7枚。","Casting the Burst sets the #8Star Jade# count to 7. Later Normal Attack gains do not reduce those existing jades to the ordinary cap of 3."],"icon":"Skill_Icon/1017/1017_C06.png","index":6}]},"1018":{"stats":{"BaseHP":1094.0,"BaseATK":42.0,"BaseDEF":54.0,"BaseEM":0.0,"BaseRechargeRate":1.0,"CritRate":0.05,"CritDMG":0.5},"skills":[{"name":["征涛·普攻","Oceanborne · Normal Attack"],"description":["对一名敌人造成相当于112.1%攻击力的物理伤害。#8雷兽之盾#存在时，普攻命中可触发雷电弹射。\\n消耗25点AP。\\n\\n#8雷兽之盾#\\n持续4回合，使北斗受到的伤害降低20.0%。北斗的普攻或重击每段命中时，触发一轮3次雷电弹射。每次弹射对一名随机敌人造成相当于96.0%攻击力的#3雷元素#爆发伤害。同一敌人可重复被选中。","Deals 112.1% ATK as Physical DMG to one enemy. While #8Thunderbeast's Targe# lasts, Normal Attack hits can trigger lightning bounces.\\nCosts 25 AP.\\n\\n#8Thunderbeast's Targe#\\nLasts 4 turns and reduces Beidou's incoming DMG by 20.0%. A hit from Beidou's Normal or Heavy Attack triggers a volley of 3 lightning bounces. Each deals 96.0% ATK as #3Electro# Burst DMG to a random enemy. Targets can repeat."]},{"name":["征涛·重击","Oceanborne · Heavy Attack"],"description":["对三名相邻敌人造成相当于56.2%攻击力的物理伤害。#8雷兽之盾#存在时，重击命中可触发雷电弹射。\\n消耗35点AP。\\n\\n#8雷兽之盾#\\n持续4回合，使北斗受到的伤害降低20.0%。北斗的普攻或重击每段命中时，触发一轮3次雷电弹射。每次弹射对一名随机敌人造成相当于96.0%攻击力的#3雷元素#爆发伤害。同一敌人可重复被选中。","Deals 56.2% ATK as Physical DMG to 3 adjacent enemies. While #8Thunderbeast's Targe# lasts, Heavy Attack hits can trigger lightning bounces.\\nCosts 35 AP.\\n\\n#8Thunderbeast's Targe#\\nLasts 4 turns and reduces Beidou's incoming DMG by 20.0%. A hit from Beidou's Normal or Heavy Attack triggers a volley of 3 lightning bounces. Each deals 96.0% ATK as #3Electro# Burst DMG to a random enemy. Targets can repeat."]},{"name":["捉浪","Tidecaller"],"description":["为自身及两侧相邻角色生成#3雷元素护盾#，并嘲讽敌人。北斗在敌方回合结束或本次任一护盾破碎时，自动对全体敌人发起#3雷元素#反击，随后解除本次护盾和#8嘲讽#。\\n消耗30点AP，冷却2回合。\\n\\n#8架盾#\\n每面护盾吸收量为14.4%生命值上限 + 1386.0。敌方角色和状态行动命中北斗时，积攒1层反击威力，最多2层。0／1／2层反击分别造成121.6%／281.6%／441.6%攻击力的#3雷元素伤害#，并分别产生4／6／8点#3雷元素能量#。\\n\\n#8嘲讽#\\n迫使敌方在选择非弹射攻击的目标时包含嘲讽者：单体攻击优先选中嘲讽者，相邻范围攻击必须覆盖嘲讽者。\\n弹射攻击不受#8嘲讽#限制，包括第一段就是弹射的攻击，以及后续的弹射段。#8嘲讽#不减少受到的伤害，也不阻止命中后的其他效果。","Grants Beidou and adjacent allies #3Electro# shields and taunts enemies. At the end of the enemy turn or when any of these shields breaks, Beidou automatically deals #3Electro DMG# to all enemies, then ends the shields and the taunt.\\nCosts 30 AP, 2-turn cooldown.\\n\\n#8Guard#\\nEach shield absorbs 14.4% Max HP + 1386.0. When an enemy or enemy status action lands a hit on Beidou, she gains 1 stack of counter strength, up to 2. At 0/1/2 stacks the counter deals 121.6%/281.6%/441.6% ATK as #3Electro DMG# and generates 4/6/8 #3Electro Energy#, respectively.\\n\\n#8Taunt#\\nForces enemy target selection to include the taunting character. Non-bouncing single-target attacks prioritize a taunter, and adjacent-area attacks must include one.\\nBouncing attacks are unaffected, including attacks that begin with a bounce and subsequent bounces. #8Taunt# does not reduce damage or prevent other effects after a hit."],"icon":"Skill_Icon/1018/1018_S01.png"},{"name":["斫雷","Stormbreaker"],"description":["对所有敌人造成相当于121.6%攻击力的#3雷元素伤害#，并获得持续4回合的#8雷兽之盾#。\\n消耗80点元素能量，冷却5回合。\\n\\n#8雷兽之盾#\\n持续4回合，使北斗受到的伤害降低20.0%。北斗的普攻或重击每段命中时，触发一轮3次雷电弹射。每次弹射对一名随机敌人造成相当于96.0%攻击力的#3雷元素#爆发伤害。同一敌人可重复被选中。","Deals 121.6% ATK as #3Electro DMG# to all enemies and grants #8Thunderbeast's Targe# for 4 turns.\\nCosts 80 Energy, 5-turn cooldown.\\n\\n#8Thunderbeast's Targe#\\nLasts 4 turns and reduces Beidou's incoming DMG by 20.0%. A hit from Beidou's Normal or Heavy Attack triggers a volley of 3 lightning bounces. Each deals 96.0% ATK as #3Electro# Burst DMG to a random enemy. Targets can repeat."],"icon":"Skill_Icon/1018/1018_S02.png"}],"talents":[{"name":["遍宇灵光","Retribution"],"description":["捉浪的护盾破碎时，反击直接达到两层威力。","When a Tidecaller shield breaks, Beidou counters at full two-stack strength."],"icon":"Skill_Icon/1018/1018_T01.png","threshold":20},{"name":["霹雳连霄","Lightning Storm"],"description":["施放两层威力的捉浪反击后，普通攻击与重击造成的伤害提高15%，普通攻击消耗的AP减少5点，重击消耗的AP减少10点，持续2回合。","Releasing a two-stack counter grants 15% Normal and Heavy Attack DMG Bonus, reduces Normal Attack cost by 5 AP and Heavy Attack cost by 10 AP, for 2 turns."],"icon":"Skill_Icon/1018/1018_T02.png","threshold":60}],"constellations":[{"name":["鱼龙沉四方","Sea Beast's Scourge"],"description":["施放斫雷时，为北斗生成伤害吸收量为生命值上限16%的#3雷元素护盾#，持续4回合。","Casting Stormbreaker additionally grants Beidou an #3Electro shield# with absorption equal to 16% of her Max HP for 4 turns."],"icon":"Skill_Icon/1018/1018_C01.png","index":1},{"name":["赫赫雷涌起","Upon the Turbulent Sea, the Thunder Arises"],"description":["#8雷兽之盾#每次触发的雷电弹射增加两次。","Each volley from #8Thunderbeast's Targe# adds 2 lightning bounces, increasing from 3 to 5."],"icon":"Skill_Icon/1018/1018_C02.png","index":2},{"name":["潮奔蓦引电","Summoner of Storm"],"description":["捉浪的技能等级提高3级，最高15级。","Increases the level of Tidecaller by 3, up to Level 15."],"icon":"Skill_Icon/1018/1018_C03.png","index":3},{"name":["牵星觅乡岸","Stunning Revenge"],"description":["受到攻击后的2回合内，北斗普通攻击命中时，会对同一敌人追加#3雷元素伤害#，倍率为当前普通攻击倍率的20%。再次受到攻击会刷新持续时间。","For 2 turns after Beidou is hit, her Normal Attack hits add #3Electro DMG# to the same enemy at 20% of her current Normal Attack multiplier. Getting hit again refreshes the duration."],"icon":"Skill_Icon/1018/1018_C04.png","index":4},{"name":["踏浪霞连阶","Crimson Tidewalker"],"description":["斫雷的技能等级提高3级，最高15级。","Increases the level of Stormbreaker by 3, up to Level 15."],"icon":"Skill_Icon/1018/1018_C05.png","index":5},{"name":["北斗祓幽孽","Bane of Evil"],"description":["#8雷兽之盾#存在期间，所有敌人的#3雷元素抗性#降低15%。","While #8Thunderbeast's Targe# exists, all enemies lose 15% #3Electro RES#."],"icon":"Skill_Icon/1018/1018_C06.png","index":6}]},"1019":{"stats":{"BaseHP":1003.0,"BaseATK":43.0,"BaseDEF":63.0,"BaseEM":0.0,"BaseRechargeRate":1.0,"CritRate":0.05,"CritDMG":0.5},"skills":[{"name":["钢脊·普攻","Steel Fang · Normal Attack"],"description":["对一名敌人造成相当于136.1%攻击力的物理伤害。#8雷狼#在场时，普攻会触发#3雷元素#协同攻击。\\n消耗25点AP。\\n\\n#8雷狼#\\n持续4回合。雷泽的普攻AP消耗降低5点。每次普攻引发#3雷元素#协同攻击，倍率为当前普攻倍率的24.0%。雷泽切换至后台时提前结束，每剩余1回合为雷泽返还3点能量。","Deals 136.1% ATK as Physical DMG to one enemy. While the #8Wolf Within# is present, Normal Attacks trigger a coordinated #3Electro# attack.\\nCosts 25 AP.\\n\\n#8Wolf Within#\\nLasts 4 turns. Razor's Normal Attacks cost 5 less AP and trigger a coordinated #3Electro# attack with 24.0% of his current Normal Attack multiplier. Ends early when he switches out and refunds 3 Energy per remaining turn."]},{"name":["钢脊·重击","Steel Fang · Heavy Attack"],"description":["对三名相邻敌人造成相当于62.5%攻击力的物理伤害。\\n消耗35点AP。","Deals 62.5% ATK as Physical DMG to 3 adjacent enemies.\\nCosts 35 AP."]},{"name":["利爪与苍雷","Claw and Thunder"],"description":["一段\\n对三名相邻敌人造成相当于199.2%攻击力的#3雷元素伤害#，并获得1层#8雷之印#，持续5回合。选择目标时再次点击战技，可切换为二段。\\n消耗15点AP，冷却1回合。\\n\\n二段\\n对所有敌人造成相当于295.2%攻击力的#3雷元素伤害#，并消耗全部#8雷之印#。每消耗1层，恢复自身5点能量。\\n消耗30点AP，冷却2回合。\\n\\n#8雷之印#\\n雷泽持有的#8雷之印#，持续5回合，最多3层，每层提高20%元素充能效率。再次获得时，刷新已有#8雷之印#的共同持续时间。\\n施放二段战技或爆发时消耗全部#8雷之印#，每消耗1层，为雷泽恢复5点能量。","First form\\nDeals 199.2% ATK as #3Electro DMG# to 3 adjacent enemies and grants 1 #8Electro Sigil# for 5 turns. Press the Skill button again during target selection to switch to the second stage.\\nCosts 15 AP, 1-turn cooldown.\\n\\nSecond form\\nDeals 295.2% ATK as #3Electro DMG# to all enemies and consumes all #3Electro# Sigils, restoring 5 Energy per sigil consumed.\\nCosts 30 AP, 2-turn cooldown.\\n\\n#8Electro Sigil#\\nSigils held by Razor for 5 turns, up to 3 stacks. Each increases Energy Recharge by 20%. Gaining more refreshes the shared duration of the existing sigils.\\nThe second Skill stage or the Burst consumes all sigils, restoring 5 Energy to Razor per sigil consumed."],"icon":"Skill_Icon/1019/1019_S01.png"},{"name":["雷牙","Lightning Fang"],"description":["雷泽登场，对所有敌人造成相当于160.0%攻击力的#3雷元素伤害#，并获得持续4回合的#8雷狼#。消耗全部#8雷之印#，每层恢复5点能量。\\n消耗80点元素能量，冷却5回合。\\n\\n#8雷狼#\\n持续4回合。雷泽的普攻AP消耗降低5点。每次普攻引发#3雷元素#协同攻击，倍率为当前普攻倍率的24.0%。雷泽切换至后台时提前结束，每剩余1回合为雷泽返还3点能量。\\n\\n#8雷之印#\\n雷泽持有的#8雷之印#，持续5回合，最多3层，每层提高20%元素充能效率。再次获得时，刷新已有#8雷之印#的共同持续时间。\\n施放二段战技或爆发时消耗全部#8雷之印#，每消耗1层，为雷泽恢复5点能量。","Razor takes the field, deals 160.0% ATK as #3Electro DMG# to all enemies, and gains #8Wolf Within# for 4 turns. Consumes all #3Electro# Sigils, restoring 5 Energy each.\\nCosts 80 Energy, 5-turn cooldown.\\n\\n#8Wolf Within#\\nLasts 4 turns. Razor's Normal Attacks cost 5 less AP and trigger a coordinated #3Electro# attack with 24.0% of his current Normal Attack multiplier. Ends early when he switches out and refunds 3 Energy per remaining turn.\\n\\n#8Electro Sigil#\\nSigils held by Razor for 5 turns, up to 3 stacks. Each increases Energy Recharge by 20%. Gaining more refreshes the shared duration of the existing sigils.\\nThe second Skill stage or the Burst consumes all sigils, restoring 5 Energy to Razor per sigil consumed."],"icon":"Skill_Icon/1019/1019_S02.png"}],"talents":[{"name":["觉醒","Awakening"],"description":["施放雷牙时，重置利爪与苍雷的冷却时间。","Casting Lightning Fang resets the cooldown of Claw and Thunder."],"icon":"Skill_Icon/1019/1019_T01.png","threshold":20},{"name":["饥饿","Hunger"],"description":["雷泽的元素能量低于50%时，元素充能效率提高30%。","When Razor has less than 50% Energy, his Energy Recharge increases by 30%."],"icon":"Skill_Icon/1019/1019_T02.png","threshold":60},{"name":["魔女的前夜礼·苍雷奔涌","Witch's Eve Rite: Surge of Lightning"],"description":["队伍中存在至少两名魔导角色时：#8雷狼#协同攻击造成的基础伤害提高，提高值相当于雷泽攻击力的70%；#8雷狼#存在期间，施放利爪与苍雷获得#8雷之印#时，若#8雷之印#溢出，则对本次战技命中的敌人额外造成150%攻击力的#3雷元素伤害#，并为雷泽恢复7点元素能量。","With at least 2 Hexerei characters in the party, the #8Wolf Within#'s coordinated attack gains base damage equal to 70% of Razor's ATK. While it is active, if the first stage of Claw and Thunder grants excess #3Electro# Sigils, it deals extra #3Electro DMG# equal to 150% ATK to the enemies hit and restores 7 Energy to Razor."],"icon":"Skill_Icon/1019/1019_T03.png","threshold":0}],"constellations":[{"name":["狼性","Wolf's Instinct"],"description":["雷泽获得元素能量后，造成的伤害提高10%，持续2回合。","When Razor gains Energy, his damage increases by 10% for 2 turns."],"icon":"Skill_Icon/1019/1019_C01.png","index":1},{"name":["压制","Suppression"],"description":["攻击生命值低于30%的敌人时，暴击率提高10%。","Razor gains 10% CRIT Rate against enemies below 30% HP."],"icon":"Skill_Icon/1019/1019_C02.png","index":2},{"name":["兽魂","Soul Companion"],"description":["雷牙的技能等级提高3级，最高15级。","Increases the level of Lightning Fang by 3, up to Level 15."],"icon":"Skill_Icon/1019/1019_C03.png","index":3},{"name":["撕咬","Bite"],"description":["利爪与苍雷的一段战技命中敌人时，使其防御力降低15%，持续2回合。","The first Skill stage reduces enemies' DEF by 15% for 2 turns after hitting."],"icon":"Skill_Icon/101 n cooldown.\\n\\nSecond form\\nDeals 2 hits of #1Pyro DMG# at 84.0% ATK and 92.0% ATK respectively to 3 adjacent enemies and makes susceptible enemies airborne for 1 turn. Generates 6 #1Pyro Energy# on cast.\\nCosts 20 AP, 2-turn cooldown.\\n\\nThird form\\nDeals 3 hits of #1Pyro DMG# at 88.0% ATK, 96.0% ATK, and 132.0% ATK respectively to 3 adjacent enemies and makes Bennett and susceptible enemies airborne for 1 turn. Generates 6 #1Pyro Energy# on cast.\\nCosts 30 AP, 3-turn cooldown.\\n\\n#8Airborne#\\nPrevents the target from acting. A shield can block #8Airborne# on an ally. The active ally can end one #8Airborne# effect early by clicking the control indicator 3 times and paying 10 AP."],"icon":"Skill_Icon/1020/1020_S01.png"},{"name":["美妙旅程","Fantastic Voyage"],"description":["选择两名相邻我方角色作为#8鼓舞对象#，对所有敌人造成相当于232.8%攻击力的#1火元素伤害#，并展开持续3回合的#8鼓舞领域#。\\n消耗60点元素能量，冷却4回合。\\n\\n#8鼓舞领域#\\n持续3回合。#8鼓舞对象#的生命值高于70%时，获得相当于班尼特基础攻击力56.0%的攻击力加成。我方和敌方回合结束时，为生命值低于70%的我方角色恢复相当于12.0%生命值上限 + 1154.0的生命值，并为我方全体施加#1火元素附着#。","Selects 2 adjacent allies as Inspiration Targets, deals 232.8% ATK as #1Pyro DMG# to all enemies, and creates an #8Inspiration Field# for 3 turns.\\nCosts 60 Energy, 4-turn cooldown.\\n\\n#8Inspiration Field#\\nLasts 3 turns. Inspiration Targets above 70% HP gain ATK equal to 56.0% of Bennett's Base ATK. At the end of each allied and enemy turn, heals allies below 70% HP for 12.0% Max HP + 1154.0 and applies #1Pyro# to all allies."],"icon":"Skill_Icon/1020/1020_S02.png"}],"talents":[{"name":["热情复燃","Rekindle"],"description":["施放美妙旅程后，热情过载的冷却时间减少1回合。","Casting Fantastic Voyage reduces the cooldown of Passion Overload by 1 turn."],"icon":"Skill_Icon/1020/1020_T01.png","threshold":20},{"name":["无畏的热血","Fearnaught"],"description":["#8鼓舞领域#存在时，热情过载消耗的AP降低50%，且三段热情过载不会将班尼特自身击飞。","While #8Inspiration Field# exists, Bennett's Skill costs 50% less AP and its third stage does not make Bennett himself airborne."],"icon":"Skill_Icon/1020/1020_T02.png","threshold":60}],"constellati K as #3Electro# Skill DMG. Her Heavy Attack hits at the marked position, including splash, trigger 2 Thunderclap hits at 126.0% ATK each and remove the stiletto. Active removal generates 6 #3Electro Energy#. On expiry, the first Skill stage returns."],"icon":"Skill_Icon/1029/1029_S01.png"},{"name":["天街巡游","Starward Sword"],"description":["对所有敌人造成十段#3雷元素伤害#。首段为88.0%攻击力，随后八段各为24.0%攻击力，末段为188.8%攻击力。\\n消耗40点元素能量，冷却3回合。","Deals 10 hits of #3Electro DMG# to all enemies. The first hit deals 88.0% ATK, the next eight deal 24.0% ATK each, and the final hit deals 188.8% ATK.\\nCosts 40 Energy, 3-turn cooldown."],"icon":"Skill_Icon/1029/1029_S02.png"}],"talents":[{"name":["抵天雷罚","Thundering Penance"],"description":["主动清除#8雷楔#后的2回合内，刻晴获得#3雷元素附魔#。","Actively removing the #8Lightning Stiletto# grants Keqing #3Electro Infusion# for 2 turns. Damage resolved before removal is not retroactively infused."],"icon":"Skill_Icon/1029/1029_T01.png","threshold":20},{"name":["玉衡之贵","Aristocratic Dignity"],"description":["施放天街巡游时，刻晴的暴击率和元素充能效率均提高15%，持续2回合。","Casting Starward Sword grants Keqing 15% CRIT Rate and 15% Energy Recharge for 2 turns."],"icon":"Skill_Icon/1029/1029_T02.png","threshold":60}],"constellations":[{"name":["雷厉","Thundering Might"],"description":["星斗归位第一段的AP消耗减少10点。","Reduces the first Skill stage's AP cost by 10."],"icon":"Skill_Icon/1029/1029_C01.png","index":1},{"name":["苛捐","Keen Extraction"],"description":["普通攻击与重击命中受到#3雷元素#影响的敌人时，有50%的概率产生2点#3雷元素能量#。每回合至多触发一次。","Each enemy already affected by #3Electro# and hit by Keqing's Normal or Heavy Attack independently gives a 50% chance to generate 2 #3Electro Energy#. Can succeed once per turn."],"icon":"Skill_Icon/1029/1029_C02.png","index":2},{"name":["登楼","Foreseen Reformation"],"description":["天街巡游的技能等级提高3级，最高15级。","Increases the level of Starward Sword by 3, up to Level 15."],"icon":"Skill_Icon/1029/1029_C03.png","index":3},{"name":["调律","Attunement"],"description":["刻晴触发#3雷元素#相关反应后，攻击力提高25%，持续3回合。再次触发时刷新持续时间。","When Keqing triggers an #3Electro#-related reaction, her ATK increases by 25% for 3 turns. Triggering it again refreshes the duration."],"icon":"Skill_Icon/1029/1029_C04.png","index":4},{"name":["移灯","Beckoning Stars"],"description":["星斗归位的技能等级提高3级，最高15级。","Increases the level of Stellar Restoration by 3, up to Level 15."],"icon":"Skill_Icon/1029/1029_C05.png","index":5},{"name":["廉贞","Tenacious Star"],"description":["进行普通攻击、重击、主动清除#8雷楔#或施放元素爆发时，刻晴获得6%#3雷元素伤害加成#，持续2回合。四种来源的效果可独立存在，同一来源再次触发时刷新持续时间。","Keqing gains 6% #3Electro DMG Bonus# for 2 turns when she uses a Normal Attack, uses a Heavy Attack, actively removes a #8Lightning Stiletto#, or casts her Burst. The four sources can coexist and refresh independently."],"icon":"Skill_Icon/1029/1029_C06.png","index":6}]},"1030":{"stats":{"BaseHP":1020.0,"BaseATK":47.0,"BaseDEF":63.0,"BaseEM":0.0,"BaseRechargeRate":1.0,"CritRate":0.05,"CritDMG":0.5},"skills":[{"name":["断雨·普攻","Cutting Torrent · Normal Attack"],"description":["远程姿态\\n对一名敌人造成相当于72.8%攻击力的物理伤害。\\n消耗20点AP。\\n\\n#8近战状态#\\n对一名敌人造成两段#2水元素伤害#，各段倍率依次为35.4%和37.7%攻击力。\\n消耗20点AP。\\n\\n#8近战状态#\\n持续5回合。普攻和重击改为两段#2水元素#攻击；重击的每段对相邻敌人造成50%溅射伤害。命中已有#8断流#的敌人时，可触发#8断流·斩#。\\n战技按钮替换为解除#8近战状态#，解除不消耗AP；也可等待持续时间结束。切换队友不直接解除此状态。\\n近战结束后恢复远程攻击及原战技。战技恢复所需冷却为已持续的回合数加1，因此刚进入就立即解除时为1回合。\\n\\n#8断流#\\n#8断流#持续3回合，再次施加时刷新。蓄力重击、近战普攻或重击、近战爆发命中带有#8断流#的敌人时，分别触发#8断流·闪#、#8断流·斩#和#8断流·爆#。带有#8断流#的敌人被击败时触发#8断流·破#。蓄力重击和近战攻击须命中原先已有#8断流#的敌人，才会触发闪或斩。\\n\\n#8断流·斩#\\n近战普攻或重击命中已有#8断流#的敌人时，对该位置及相邻位置造成相当于60.2%攻击力的#2水元素#战技伤害。每回合最多由2段攻击触发。单段命中多个#8断流#目标时，可同时引发多处#8断流·斩#。与#8断流·闪#共用每回合1次的2点回能。\\n\\n#8断流·破#\\n带有#8断流#的敌人被击败时，对相邻位置的敌人造成相当于62.0%攻击力的#2水元素伤害#，并为命中的敌人施加#8断流#。","Ranged stance\\nDeals 72.8% ATK as Physical DMG to one enemy.\\nCosts 20 AP.\\n\\n#8Melee Stance#\\nDeals 2 hits of #2Hydro DMG# at 35.4% ATK and 37.7% ATK respectively to one enemy.\\nCosts 20 AP.\\n\\n#8Melee Stance#\\nLasts 5 turns. Normal and Heavy Attacks become 2-hit #2Hydro# attacks. Each Heavy Attack hit deals 50% splash DMG to adjacent enemies. Hits against enemies already affected by #8Riptide# can trigger #8Riptide Slash#.\\nThe Skill button becomes a cancellation action that costs no AP. The stance also ends when its duration expires. Switching allies does not directly cancel it.\\nEnding the stance restores ranged attacks and the original Skill. Its recovery cooldown equals the elapsed stance turns plus 1; cancelling immediately after entry therefore gives a 1-turn cooldown.\\n\\n#8Riptide#\\nRiptide lasts 3 turns and refreshes on reapplication. A charged Heavy Attack, a melee Normal or Heavy Attack, and the melee Burst trigger #8Riptide Flash#, #8Riptide Slash#, and #8Riptide Blast#, respectively. Defeating a marked enemy triggers #8Riptide Burst#. Flash and Slash require the mark to be present before the triggering hit.\\n\\n#8Riptide Slash#\\nHits from melee Normal or Heavy Attacks against enemies already marked with #8Riptide# deal 60.2% ATK as #2Hydro# Skill DMG at each marked position hit and its adjacent positions. Up to 2 attack hits can trigger this per turn. Shares one 2-Energy refund per turn with #8Riptide Flash#.\\n\\n#8Riptide Burst#\\nDefeating a marked enemy deals 62.0% ATK as #2Hydro DMG# to enemies in adjacent positions and applies #8Riptide# to those hit."]},{"name":["断雨·重击","Cutting Torrent · Heavy Attack"],"description":["远程姿态\\n对选定位置蓄力，1回合后造成相当于124.0%攻击力的#2水元素伤害#，并施加持续3回合的#8断流#。命中已有#8断流#的目标时，触发三段#8断流·闪#。\\n消耗30点AP。\\n\\n#8近战状态#\\n对一名敌人造成两段#2水元素伤害#，各段倍率依次为28.3%和30.1%攻击力，每段对相邻敌人造成50%的溅射伤害。\\n消耗30点AP。\\n\\n#8断流#\\n#8断流#持续3回合，再次施加时刷新。蓄力重击、近战普攻或重击、近战爆发命中带有#8断流#的敌人时，分别触发#8断流·闪#、#8断流·斩#和#8断流·爆#。带有#8断流#的敌人被击败时触发#8断流·破#。蓄力重击和近战攻击须命中原先已有#8断流#的敌人，才会触发闪或斩。\\n\\n#8断流·闪#\\n蓄力重击命中已有#8断流#的敌人时，对该敌人追加三段#2水元素#普攻伤害，每段相当于12.4%攻击力。与#8断流·斩#共用每回合1次回能机会，命中后为达达利亚恢复2点能量。\\n\\n#8近战状态#\\n持续5回合。普攻和重击改为两段#2水元素#攻击；重击的每段对相邻敌人造成50%溅射伤害。命中已有#8断流#的敌人时，可触发#8断流·斩#。\\n战技按钮替换为解除#8近战状态#，解除不消耗AP；也可等待持续时间结束。切换队友不直接解除此状态。\\n近战结束后恢复远程攻击及原战技。战技恢复所需冷却为已持续的回合数加1，因此刚进入就立即解除时为1回合。\\n\\n#8断流·斩#\\n近战普攻或重击命中已有#8断流#的敌人时，对该位置及相邻位置造成相当于6 te":0.05,"CritDMG":0.5},"skills":[{"name":["岩雨·普攻","Rain of Stone · Normal Attack"],"description":["对一名敌人造成相当于54.5%攻击力的物理伤害。\\n消耗20点AP。","Deals 54.5% ATK as Physical DMG to one enemy.\\nCosts 20 AP."]},{"name":["岩雨·重击","Rain of Stone · Heavy Attack"],"description":["对一名敌人造成相当于111.0%攻击力的物理伤害。\\n消耗30点AP。","Deals 111.0% ATK as Physical DMG to one enemy.\\nCosts 30 AP."]},{"name":["地心","Dominus Lapidis"],"description":["对所有敌人造成相当于80.0%攻击力的#6岩元素伤害#，在选定位置创造持续5回合的#8岩脊#，并生成持续5回合、保护全队的#8玉璋护盾#。\\n消耗30点AP，冷却3回合。\\n\\n#8岩脊#\\n持续5回合的岩造物，通常全场最多1根。同一位置再次放置时刷新，超过上限时替换最早的#8岩脊#。我方回合结束时，对所在位置及相邻位置造成相当于32.0%攻击力的#6岩元素#共鸣伤害。共鸣可通过其他岩造物和月笼传导，空位置也可参与。每个岩造物每回合至多接受一次传导，#8岩脊#自身的回合末共鸣另计。#8岩脊#自身每次共鸣命中有70%概率产生2点#6岩元素能量#，全场#8岩脊#每回合共可成功2次。\\n\\n#8玉璋护盾#\\n持续5回合，保护全队。全队共享盾量，施放时每有1名存活的我方角色，盾量增加12.8%生命值上限 + 1232.0，护盾强效以钟离的数值为准。护盾存在时，全体敌人的所有元素抗性和物理抗性降低20%。重新施加时生成新的护盾。","Deals 80.0% ATK as #6Geo DMG# to all enemies, creates a #8Stone Stele# at the selected position for 5 turns, and grants a #8Jade Shield# protecting all allies for 5 turns.\\nCosts 30 AP, 3-turn cooldown.\\n\\n#8Stone Stele#\\nA #6Geo# Construct lasting 5 turns, normally limited to 1 on the field. Recasting at the same position refreshes it. Exceeding the limit replaces the oldest stele. At the end of each allied turn, deals 32.0% ATK as #6Geo# resonance DMG at its position and adjacent positions. Resonance can propagate through #6Geo# Constructs and Moon Cages, even in empty positions. Each construct can receive one propagated resonance per turn, separately from a stele's own scheduled attack. A stele's own resonance has a 70% chance to generate 2 #6Geo Energy# on a hit, with up to 2 successful generations per turn across all steles.\\n\\n#8Jade Shield#\\nProtects the entire party for 5 turns with a shared pool. The shared shield pool gains 12.8% Max HP + 1232.0 for each ally alive when cast. Uses Zhongli's Shield Strength. While active, reduces all enemies' Elemental and Physical RES by 20%. Reapplying creates a new shield."],"icon":"Skill_Icon/1032/1032_S01.png"},{"name":["天星","Planet Befall"],"description":["对所有敌人造成相当于401.1%攻击力的#6岩元素伤害#，并使可被石化的敌人石化1回合。\\n消耗40点元素能量，冷却3回合。\\n\\n#8石化#\\n使目标无法行动，持续时间结束后解除。\\n#8石化#不属于冻结，不赋予元素附着，也不会使攻击触发碎冰。","Deals 401.1% ATK as #6Geo DMG# to all enemies and Petrifies susceptible enemies for 1 turn.\\nCosts 40 Energy, 3-turn cooldown.\\n\\n#8Petrification#\\nPrevents the target from acting until its duration ends.\\n#8Petrification# is not Frozen: it does not apply an elemental aura or enable Shatter."],"icon":"Skill_Icon/1032/1032_S02.png"}],"talents":[{"name":["悬岩宸断","Resonant Waves"],"description":["#8玉璋护盾#受到伤害时，钟离的护盾强效提升5%，至多叠加5次，持续至护盾消失。","When #8Jade Shield# absorbs damage, Zhongli gains 5% Shield Strength, up to 5 stacks. New stacks apply to subsequent damage. Reapplying or losing the shield clears its stacks."],"icon":"Skill_Icon/1032/1032_T01.png","threshold":20},{"name":["炊金馔玉","Dominance of Earth"],"description":["普通攻击与重击的基础伤害提高，提高值相当于钟离生命值上限的1.39%；地心与#8岩脊#共鸣的基础伤害提高，提高值相当于钟离生命值上限的1.9%。","Adds 1.39% of Zhongli's Max HP to the base damage of his Normal and Heavy Attacks. Adds 1.9% of his Max HP to the base damage of Dominus Lapidis and #8Stone Stele# resonance."],"icon":"Skill_Icon/1032/1032_T02.png","threshold":60}],"constellations":[{"name":["岩者，六合引之为骨","Rock, the Backbone of Earth"],"description":["地心创造的#8岩脊#至多可同时存在2根。","Allows 2 steles at once. Recasting at the same position refreshes it; exceeding the total replaces the oldest stele."],"icon":"Skill_Icon/1032/1032_C01.png","index":1},{"name":["石者，八荒韫玉而明","Stone, the Cradle of Jade"],"description":["施放天星时，为全队生成与地心相同的#8玉璋护盾#，持续5回合。全队共享盾量，施放时每有1名存活的我方角色，盾量增加12.8%生命值上限 + 1232.0。","Casting Planet Befall also grants the party the #8Jade Shield# from Dominus Lapidis for 5 turns. The shared shield pool gains 12.8% Max HP + 1232.0 for each ally alive when cast."],"icon":"Skill_Icon/1032/1032_C02.png","index":2},{"name":["圭璋，暝仍不移其晖","Jade, Shimmering through Darkness"],"description":["地心的技能等级提高3级，最高15级。","Increase .\\nCosts 30 AP, 2-turn cooldown.\\n\\n#8Scarlet Seal#\\nYanfei gains 1 #8Scarlet Seal# after a Normal Attack hits, up to 3. Seals last 3 turns and gaining one refreshes their duration. Her Skill and Burst replenish them. A Heavy Attack consumes all seals, with each reducing its cost by 4 AP and increasing its damage. Seals remain when Yanfei switches out."],"icon":"Skill_Icon/1039/1039_S01.png"},{"name":["凭此结契","Done Deal"],"description":["对所有敌人造成相当于182.4%攻击力的#1火元素伤害#，补满#8丹火印#，并获得持续4回合的#8灼灼#。\\n消耗80点元素能量，冷却5回合。\\n\\n#8丹火印#\\n烟绯每次普攻命中后获得1枚#8丹火印#，持续3回合，最多3枚。获得新印会刷新已有#8丹火印#的持续时间。战技和爆发可补满#8丹火印#。施放重击时消耗全部#8丹火印#，每枚降低重击4点AP消耗，并提高该次重击伤害。切换至后台时仍保留。\\n\\n#8灼灼#\\n持续4回合，烟绯重击伤害提高33.4%。我方每累计消耗20点AP，烟绯获得1枚#8丹火印#。#8丹火印#在本次行动和后续效果全部结束后，或换人完成后发放。余数保留到敌方回合结束。烟绯在后台时仍可累计。","Deals 182.4% ATK as #1Pyro DMG# to all enemies, replenishes Scarlet Seals, and grants #8Brilliance# for 4 turns.\\nCosts 80 Energy, 5-turn cooldown.\\n\\n#8Scarlet Seal#\\nYanfei gains 1 #8Scarlet Seal# after a Normal Attack hits, up to 3. Seals last 3 turns and gaining one refreshes their duration. Her Skill and Burst replenish them. A Heavy Attack consumes all seals, with each reducing its cost by 4 AP and increasing its damage. Seals remain when Yanfei switches out.\\n\\n#8Brilliance#\\nLasts 4 turns and increases Yanfei's Heavy Attack DMG by 33.4%. Each 20 AP spent by the party grants her 1 #8Scarlet Seal#. Seals are awarded after the action and its follow-ups finish, or after a switch completes. Leftover AP progress carries over until the end of the enemy turn. This effect continues while Yanfei is off-field."],"icon":"Skill_Icon/1039/1039_S02.png"}],"talents":[{"name":["关联条款","Proviso"],"description":["重击消耗#8丹火印#前，每枚#8丹火印#为烟绯提供5%#1火元素伤害加成#，持续2回合。再次施放重击时，按本次消耗的#8丹火印#数量重新计算并刷新持续时间。","Before a Heavy Attack consumes seals, each grants 5% #1Pyro DMG Bonus# for 2 turns. A new Heavy Attack recalculates the bonus from its consumed seals and replaces the old bonus."],"icon":"Skill_Icon/1039/1039_T01.png","threshold":20 "name":["西风剑术·宗室·重击","Favonius Bladework - Edel · Heavy Attack"],"description":["对一名敌人造成相当于68.8%攻击力的物理伤害。\\n消耗30点AP。","Deals 68.8% ATK as Physical DMG to one enemy.\\nCosts 30 AP."]},{"name":["冰潮的涡漩","Icetide Vortex"],"description":["一段\\n对三名相邻敌人造成相当于146.4%攻击力的#4冰元素伤害#，并获得1层#8冷酷之心#，持续5回合。选择目标时再次点击战技，可切换为二段。施放时产生3点#4冰元素能量#。\\n消耗15点AP，冷却1回合。\\n\\n二段\\n消耗全部#8冷酷之心#，对所有敌人造成相当于245.6%攻击力的#4冰元素伤害#。若消耗了层数，命中后降低敌人的物理抗性和#4冰元素抗性#16.0%，持续2回合。每消耗1层，追加一次冰涡弹射，对一名随机敌人造成相当于96.0%攻击力的#4冰元素伤害#。施放时产生5点#4冰元素能量#。\\n消耗30点AP，冷却2回合。\\n\\n#8冷酷之心#\\n持续5回合，最多2层，每层提高30%防御力。获得新层时刷新持续时间。二段战技消耗全部层数，每层追加一次冰涡弹射，造成相当于96.0%攻击力的#4冰元素伤害#。本次二段及冰涡命中后，目标的物理抗性和#4冰元素抗性#降低16.0%，持续2回合。","First form\\nDeals 146.4% ATK as #4Cryo DMG# to 3 adjacent enemies and grants 1 #8Grimheart# stack for 5 turns. Press the Skill button again during target selection to switch to the second stage. Generates 3 #4Cryo Energy# on cast.\\nCosts 15 AP, 1-turn cooldown.\\n\\nSecond form\\nConsumes all #8Grimheart# stacks and deals 245.6% ATK as #4Cryo DMG# to all enemies. If stacks were consumed, the hit reduces their Physical and #4Cryo RES# by 16.0% for 2 turns. Each stack adds an Icewhirl bounce that deals 96.0% ATK as #4Cryo DMG# to a random enemy. Generates 5 #4Cryo Energy# on cast.\\nCosts 30 AP, 2-turn cooldown.\\n\\n#8Grimheart#\\nLasts 5 turns, up to 2 stacks. Each stack increases DEF by 30%. Gaining a stack refreshes the duration. The second Skill stage consumes all stacks, with each adding an Icewhirl bounce that deals 96.0% ATK as #4Cryo DMG#. Hits from this stage or its Icewhirls reduce Physical and #4Cryo RES# by 16.0% for 2 turns."],"icon":"Skill_Icon/1040/1040_S01.png"},{"name":["凝浪之光剑","Glacial Illumination"],"description":["优菈登场，对所有敌人造成相当于245.6%攻击力的#4冰元素伤害#，并创造持续2回合的#8光降之剑#。\\n消耗80点元素能量，冷却5回合。\\n\\n#8光降之剑#\\n持续2回合，初始0点能量，最多30点。优菈的普攻、重击、战技和爆发每命中一名敌人，为每把正在积能的#8光降之剑#增加1点能量，护盾吸收或免疫命中也计入。自然到期或优菈切换至后台时引爆，对所有敌人造成相当于367.1%攻击力的物理爆发伤害，每点能量再增加相当于75.0%攻击力的伤害。多把剑可独立积能，优菈倒下时清除。","Eula takes the field, deals 245.6% ATK as #4Cryo DMG# to all enemies, and creates a #8Lightfall Sword# for 2 turns.\\nCosts 80 Energy, 5-turn cooldown.\\n\\n#8Lightfall Sword#\\nLasts 2 turns, starting at 0 Energy and capped at 30. Each enemy hit by Eula's Normal, Heavy, Skill, or Burst attacks adds 1 Energy to each charging sword, including shielded or immune hits. Detonates on expiry or when Eula switches out, dealing 367.1% ATK plus 75.0% ATK per Energy as Physical Burst DMG to all enemies. Multiple swords can charge independently and are cleared if Eula falls."],"icon":"Skill_Icon/1040/1040_S02.png"}],"talents":[{"name":["潮卷冰削","Roiling Rime"],"description":["二段冰潮的涡漩消耗两层#8冷酷之心#时，创造一把残缺的#8光降之剑#，立即对全体敌人造成相当于183.5%攻击力的物理爆发伤害，伤害为#8光降之剑#基础伤害的50%。此攻击可为现有#8光降之剑#充能。","Consuming 2 #8Grimheart# stacks with the second form of Icetide Vortex creates a Shattered #8Lightfall Sword# that immediately deals 183.5% ATK as Physical Burst DMG to all enemies, equal to half of the #8Lightfall Sword#'s base damage. The hit can charge existing Lightfall Swords."],"icon":"Skill_Icon/1040/1040_T01.png","threshold":20},{"name":["战欲涌现","Wellspring of War-Lust"],"description":["施放凝浪之光剑时，重置冰潮的涡漩的冷却时间，并获得一层#8冷酷之心#。","Casting Glacial Illumination resets Icetide Vortex's cooldown and grants 1 #8Grimheart# stack."],"icon":"Skill_Icon/1040/1040_T02.png","threshold":60}],"constellations":[{"name":["光潮的幻象","Tidal Illusion"],"description":["消耗#8冷酷之心#时，物理伤害提高30%。消耗一层时持续2回合，消耗两层时持续3回合。","Consuming #8Grimheart# grants Eula 30% Physical DMG Bonus for 2 turns when consuming 1 stack or 3 turns for 2 stacks. The bonus is granted before the second Skill stage resolves."],"icon":"Skill_Icon/1040/1040_C01.png","index":1},{"name":["海沫的少女","Lady of Seafoam"],"description":["冰潮的涡漩长按的冷却时间减少1回合。","Reduces the second Skill stage's cooldown by 1 turn."],"icon":"Skill_Icon/1040/1040_C02.png","index":2},{"name":["劳伦斯的血脉","Lawrence Pedigree"],"description":["凝浪之光剑的技能等级提高3级，最高15级。","Increases the level of Glacial Illumination by 3, up to Level 15."],"icon":"Skill_Icon/1040/1040_C03.png","index":3},{"name":["自卑者的逞强","The Obstinacy of One's Inferiors"],"description":["#8光降之剑#与残缺#8光降之剑#对生命值低于50%的敌人造成的伤害提高25%。","#8Lightfall Sword# and Shattered #8Lightfall Sword# deal 25% more damage against targets below 50% HP before the hit, as ordinary DMG Bonus."],"icon":"Skill_Icon/1040/1040_C04.png","index":4},{"name":["骑士的素质","Chivalric Quality"],"description":["冰潮的涡漩的技能等级提高3级，最高15级。","Increases the level of Icetide Vortex by 3, up to Level 15."],"icon":"Skill_Icon/1040/1040_C05.png","index":5},{"name":["高贵者的义务","Noble Obligation"],"description":["#8光降之剑#创造时立即获得5点能量。符合条件的每段伤害命中后，在正常积攒能量之外，有50%概率额外获得1点能量。","New swords start with 5 Energy. Each qualifying hit has a 50% chance to grant 1 extra Energy in addition to the normal gain. Initial and bonus Energy gains do not trigger further checks."],"icon":"Skill_Icon/1040/1040_C06.png","index":6}]}},"weapons":{"3001":{"weaponType":0,"stats":{"BaseATK":38,"RechargeBonus":0.113},"passive":{"name":["决心","Determination"],"description":["施放元素爆发后，提高12%攻击力，持续4回合。","After using an Elemental Burst, gain 12% ATK for 4 turns."]}},"3002":{"weaponType":0,"stats":{"BaseATK":39,"ATKBonus":0.077},"passive":{"name":["止水融冰","Bane of Water and Ice"],"description":["对处于#2水元素#或#4冰元素#影响下的敌人，造成的伤害提升12%。","Deal 12% more DMG to enemies affected by #2Hydro# or #4Cryo#."]}},"3005":{"weaponType":0,"stats":{"BaseATK":39,"ATKBonus":0.077},"passive":{"name":["决","Gash"],"description":["任意攻击命中时，有50%的概率对该次目标中随机一名敌人造成240%攻击力的物理伤害，每3回合触发一次。","When an attack hits, it has a 50% chance to deal 240% ATK as Physical DMG to one random enemy it hit. This can trigger once every 3 turns."]}},"3008":{"weaponType":1,"stats":{"BaseATK":38,"WeaponEM":41},"passive":{"name":["踏火息雷","Bane of Fire and Thunder"],"description":["对处于#1火元素#或#3雷元素#影响下的敌人造成的伤害提升12%。","Deal 12% more DMG to enemies affected by #1Pyro# or #3Electro#."]}},"3013":{"weaponType":2,"stats":{"BaseATK":40,"WeaponEM":20},"passive":{"name":["踏火止水","Bane of Flame and Water"],"description n. Switching the wielder in grants 20% ATK for 1 turn."]}},"3144":{"stats":{"BaseATK":42,"WeaponEM":36},"passive":{"name":["林野晚星","Wildling Nightstar"],"description":["每3回合，基于装备者元素精通的24%提升该角色攻击力，并基于该提升的30%为队伍中附近的其他角色提升攻击力，持续3回合。多件同名武器产生的此效果可以叠加，角色处于队伍后台时也能触发。","Every 3 turns, gain ATK equal to 24% of the wielder's Elemental Mastery. Other nearby party members receive 30% of that ATK bonus. It lasts 3 turns and stacks across copies of this weapon. It can trigger while the wielder is off-field."]}},"3150":{"stats":{"BaseATK":41,"RechargeBonus":0.133},"passive":{"name":["长牙飞去来","Fangs Flying To and Fro"],"description":["施放元素战技后的3回合内，生命值上限提升20%；队伍中每存在一位#2水元素#类型的角色，生命值上限进一步提升12%，至多通过这种方式提升24%。该效果每4回合至多触发一次。","For 3 turns after using an Elemental Skill, gain 20% Max HP. Each #2Hydro# character in the party grants a further 12% Max HP, up to 24% additional Max HP. This can trigger once every 4 turns."]}},"3153":{"stats":{"BaseATK":42,"CritDMG":0.12},"passive":{"name":["深宵的胎梦","Nocturnal Dreams"],"description":["重击命中敌人后的3回合内，元素精通提升72点；元素战技命中敌人后的3回合内，元素精通提升48点。","Heavy Attack hits grant 72 Elemental Mastery for 3 turns. Elemental Skill hits grant 48 Elemental Mastery for 3 turns."]}},"3154":{"stats":{"BaseATK":46,"RechargeBonus":0.12},"passive":{"name":["穿刺高天的利齿","Sky-Piercing Fang"],"description":["暴击率提升4%；施放元素爆发后，普通攻击与重击命中额外造成20%攻击力伤害，且AP消耗-1，持续3回合。","Gain 4% CRIT Rate. For 3 turns after using an Elemental Burst, Normal and Heavy Attacks cost 1 less AP and deal an additional hit of 20% ATK on hit."]}},"3156":{"stats":{"BaseATK":46,"ATKBonus":0.108},"passive":{"name":["金璋皇极","Golden Majesty"],"description":["护盾强效提升20%；攻击命中后2回合内攻击力提升4%，至多5层；每次伤害效果仅可触发一次。处于护盾庇护下时，该攻击力提升效果提高100%。","Gain 20% Shield Strength. Hits grant 4% ATK for 2 turns, up to 5 stacks. Each damage effect can trigger this once. The ATK bonus doubles while shielded."]}},"3157":{"stats":{"BaseATK":44,"CritRate":0.096},"passive":{"name":["护国的无垢之心","Protector's Virtue"],"description":["生命值提升20%；基于生命值上限的1.2%获得攻击力加成。","Gain 20% Max HP and ATK equal to 1.2% of Max HP."]}},"3158":{"stats":{"BaseATK":46,"WeaponEM":43},"passive":{"name":["抗争的践行之歌","Revolutionary Chorale"],"description":["造成的伤害提高10%；触发元素反应时，获得一层奋起之符，单次效果仅能触发一次。获得2层奋起之符后，队伍普通攻击和重击的伤害提高16%，攻击力提升20%，持续3回合，并清除所有层数，触发后5回合内无法再次获得奋起之符。我方队伍仅能从最新的状态中获得加成。","Deal 10% more DMG. Triggering an Elemental Reaction grants 1 Sigil of Rebellion, at most once per effect. At 2 Sigils, consume them to grant the party 16% Normal and Heavy Attack DMG and 20% ATK for 3 turns. No new Sigils can be gained for 5 turns. The party receives only the latest bonus of this kind."]}},"3159":{"stats":{"BaseATK":48,"CritDMG":0.096},"passive":{"name":["雾切御腰物","Mistsplitter's Edge"],"description":["获得12%所有元素伤害加成；持有1/2/3层雾切之巴印时，元素伤害分别提升8%/16%/28%。以下行为可以获得一层“巴印”：普通攻击造成元素伤害时，持续1回合；施放爆发时，持续3回合；能量未满时，并在能量回满时消失。","Gain 12% All Elemental DMG Bonus. At 1, 2, or 3 stacks of Mistsplitter's Emblem, gain 8%, 16%, or 28% Elemental DMG Bonus, respectively. Gain 1 stack by dealing Elemental DMG with a Normal Attack for 1 turn, using a Burst for 3 turns, or having less than full Energy until Energy is full."]}},"3160":{"stats":{"BaseATK":46,"CritRate":0.072},"passive":{"name":["白刃流转","Honed Flow"],"description":["获得12%所有元素伤害加成；我方其他角色施放元素战技后，会为装备者提供一层“波穗”，每次行为至多触发一次，最多叠加2层。装备者施放元素战技后，消耗所有波穗，获得对应层数的“波乱”，每层使普通攻击伤害提升20%，至多2层，持续2回合。","Gain 12% All Elemental DMG Bonus. When another allied character uses an Elemental Skill, gain 1 Wavespike, at most once per action and up to 2 stacks. Using the wielder's Elemental Skill consumes all Wavespikes. For 2 turns, each stack consumed increases Normal Attack DMG by 20%."]}},"3161":{"stats":{"BaseATK":44,"HPBonus":0.144},"passive":{"name":["沉入沙海的史诗","Sunken Song of the Sands"],"description":["生命值提升20%；元素战技命中后，为自身赋予“宏大诗篇”状态：基于生命值上限的0.12%提升元素精通，至多3层，持续5回合；满层或刷新满层时，基于生命值上限的0.2%为我方其他角色提升元素精通，持续5回合。","Gain 20% Max HP. Elemental Skill hits grant Grand Hymn for 5 turns, increasing Elemental Mastery by 0.12% of Max HP per stack, up to 3. Reaching or refreshing the maximum grants other allied characters Elemental Mastery equal to 0.2% of the wielder's Max HP for 5 turns."]}},"3162":{"stats":{"BaseATK":44,"CritDMG":0.192},"passive":{"name":["白月枝芒","Whitemoon Bristle"],"description":["暴击率提升4%；普通攻击造成元素伤害后，获得“裁叶”状态：普通攻击与元素战技基础伤害值提高，提高值相当于元素精通的120%，生效28次或3回合后结束，每3回合至多触发一次。","Gain 4% CRIT Rate. After a Normal Attack deals Elemental DMG, gain Foliar Incision, increasing Normal Attack and Elemental Skill Base DMG by 120% of Elemental Mastery. It ends after 28 instances or 3 turns and can trigger once every 3 turns."]}},"3163":{"stats":{"BaseATK":44,"CritDMG":0.192},"passive":{"name":["湖光的朝与暮","Dawn and Dusk by the Lake"],"description":["装备者生命值变化时，元素战技伤害提升8%，持续2回合，至多叠加3层；其他角色生命值变化时，装备者生命值上限提升14%，持续2回合，至多2层，单次效果仅能触发一次。装备者位于后台时也能触发。","When the wielder's HP changes, gain 8% Elemental Skill DMG for 2 turns, up to 3 stacks. When another character's HP changes, the wielder gains 14% Max HP for 2 turns, up to 2 stacks and at most once per effect. Both can trigger while off-field."]}},"3164":{"stats":{"BaseATK":44,"CritDMG":0.192},"passive":{"name":["锦之花与龛中剑","Brocade Bloom, Shrine Sword"],"description":["装备者防御力提升20%，普通攻击伤害提升16%，元素战技伤害提升24%；我方出战角色造成#6岩元素伤害#后的4回合内，后两项效果提高100%。","Gain 20% DEF, 16% Normal Attack DMG, and 24% Elemental Skill DMG. The last two bonuses double for 4 turns after the active allied character deals #6Geo DMG#."]}},"3165":{"stats":{"BaseATK":48,"CritDMG":0.096},"passive":{"name":["死之契","Deathly Pact"],"description":["暴击伤害提升20%；生命之契数值增加时，装备者造成的伤害提升16%，持续2回合，至多叠加3层。","Gain 20% CRIT DMG. When Bond of Life increases, deal 16% more DMG for 2 turns, up to 3 stacks."]}},"3166":{"stats":{"BaseATK":44,"DEFBonus":0.18},"passive":{"name":["不凋的盛年","Halcyon Years Unending"],"description":["普通攻击或重击命中后，赋予自身“荣花之歌”状态：防御力提高8%，所有元素伤害加成提高10%，持续8回合，至多叠加2层；叠加至2层或满层刷新时，每1000点防御力使队伍所有元素伤害加成提高8%，至多25.6%，持续4回合。","Normal and Heavy Attack hits grant Ode to Flowers for 8 turns. Each stack grants 8% DEF and 10% All Elemental DMG Bonus, up to 2 stacks. Reaching or refreshing the maximum grants the party 8% All Elemental DMG Bonus per 1,000 DEF, up to 25.6%, for 4 turns."]}},"3167":{"stats":{"BaseATK":48,"CritRate":0.048},"passive":{"name":["白山的馈赐","Whitehill's Bestowal"],"description":["施放元素战技后3回合内，攻击力提升24%；该状态持续期间，元素能量为0时，攻击力额外提升24%，暴击伤害提升40%。","Using an Elemental Skill grants 24% ATK for 3 turns. While the effect is active and Energy is at 0, gain a further 24% ATK and 40% CRIT DMG."]}},"3168":{"stats":{"BaseATK":46,"CritRate":0.072},"passive":{"name":["白日王的灼辉","Day King's Splendor Solis"],"description":["元素爆发暴击伤害提升16%；元素爆发命中后，获得“白昼之刃”状态：装备者攻击力提升20%，我方其他角色攻击力提升16%，持续1回合，且后台也能触发；魔导·秘仪：使“白昼之刃”状态额外提升75%效果。","Gain 16% Elemental Burst CRIT DMG. Burst hits grant Blade of Daylight for 1 turn, increasing the wielder's ATK by 20% and other allies' ATK by 16%. It can trigger while off-field. Hexerei: Secret Rite increases the effect of Blade of Daylight by 75%."]}},"3169":{"stats":{"BaseATK":44,"CritDMG":0.192},"passive":{"name":["琅玕衍义","Legacy of Lang-Gan"],"description":["防御力提高20%；施放元素战技后的1回合内，月结晶反应伤害提升64%。","Gain 20% DEF. After using an Elemental Skill, gain 64% Lunar-Crystallize DMG for 1 turn."]}},"3170":{"stats":{"BaseATK":46,"ATKBonus":0.108},"passive":{"name":["如狼般狩猎者","Wolfish Tracker"],"description":["攻击力提高20%；攻击命中生命值低于30%的敌人时，我方全体攻击力提高40%，持续3回合，每7回合至多触发一次。","Gain 20% ATK. Hitting an enemy below 30% HP grants the party 40% ATK for 3 turns. This can trigger once every 7 turns."]}},"3171":{"stats":{"BaseATK":48,"RechargeBonus":0.08},"passive":{"name":["斩裂晴空的龙脊","Sky-ripping Dragon Spine"],"description":["造成的伤害提高8%；施放元素爆发后，普通攻击和重击命中时发出真空刃，对所有命中的敌人造成80%攻击力伤害，持续5回合或触发8次伤害效果。","Deal 8% more DMG. After using an Elemental Burst, Normal and Heavy Attack hits release a vacuum blade that deals 80% ATK as DMG to all enemies hit. This lasts 5 turns or 8 damage instances."]}},"3172":{"stats":{"BaseATK":46,"ATKBonus":0.108},"passive":{"name":["金璋皇极","Golden Majesty"],"description":["护盾强效提升20%；攻击命中后2回合内攻击力提升4%，至多叠加5层，每次伤害效果只能触发一次；处于护盾庇护下时，该攻击力提升效果提高100%。","Gain 20% Shield Strength. Hits grant 4% ATK for 2 turns, up to 5 stacks. Each damage effect can trigger this once. The ATK bonus doubles while shielded."]}},"3173":{"stats":{"BaseATK":49,"PhysicalDMGBonus":0.045},"passive":{"name":["揭旗的叛逆之歌","Rebel's Banner-Hymn"],"description":["攻击力提高16%；普通攻击或重击命中获得一层“低语之符”，拥有4层后，消耗所有层数，使我方全体普通攻击AP消耗减少0点、攻击力提升20%，持续3回合；触发后5回合内无法再次获得低语之符。我方队伍仅能从最新的状态获得加成。","Gain 16% ATK. Normal and Heavy Attack hits grant 1 Sigil of Whispers. At 4 Sigils, consume them to reduce the party's Normal Attack AP cost by 0 and increase ATK by 20% for 3 turns. No new Sigils can be gained for 5 turns. The party receives only the latest bonus of this kind."]}},"3174":{"stats":{"BaseATK":44,"CritDMG":0.192},"passive":{"name":["御伽大王御伽话","Gokadaiou Otogibanashi"],"description":["防御力提高28%；普通攻击与重击的基础伤害值提高，提高值相当于防御力的40%。","Gain 28% DEF. Normal and Heavy Attack Base DMG increases by 40% of DEF."]}},"3175":{"stats":{"BaseATK":46,"CritRate":0.072},"passive":{"name":["沙海守望","Desert Watch"],"description":["元素战技命中后，攻击力提升20%，持续2回合；受到伤害后攻击力提升20%，持续2回合；两者后台也能触发。不处于护盾庇护下时，生命值上限提高32%。","Elemental Skill hits grant 20% ATK for 2 turns. Taking damage grants 20% ATK for 2 turns. Both can trigger while off-field. While unshielded, gain 32% Max HP."]}},"3176":{"stats":{"BaseATK":48,"CritRate":0.048},"passive":{"name":["诸多朝与暮的誓约","Many Oaths of Dawn and Dusk"],"description":["攻击力提升20%；我方获得结晶盾或触发月结晶反应时，为装备者赋予1层约印，每层使元素战技伤害提升18%，约印持续4回合，至多叠加2层。装备者造成战技伤害后移除。","Gain 20% ATK. When the party gains a Crystallize shield or triggers Lunar-Crystallize, the wielder gains 1 Seal for 4 turns, up to 2. Each Seal grants 18% Elemental Skill DMG. Seals are removed after the wielder deals Elemental Skill DMG."]}},"3177":{"stats":{"BaseATK":49,"CritRate":0.024},"passive":{"name":["绿松石之狩","Turquoise Hunt"],"description":["元素战技命中时，获得1层悬木祝赐，每次伤害效果仅能触发一次；我方角色触发燃烧或烈绽放反应时获得3层，位于后台时也可触发。每回合总共仅能触发两次。每层使元素战技与元素爆发伤害提升10%，持续2回合，至多6层，每层相互独立。","Elemental Skill hits grant 1 stack of Canopy's Favor, at most once per damage effect. When an ally triggers Burning or Burgeon, gain 3 stacks, including while off-field. The two sources can trigger a combined total of twice per turn. Each stack grants 10% Elemental Skill and Burst DMG for 2 turns. Up to 6 stacks can coexist, with independent durations."]}},"3178":{"stats":{"BaseATK":49,"CritRate":0.024},"passive":{"name":["落日重燃的黎明","Sunset Reignites the Dawn"],"description":["施放元素战技或元素爆发时，获得“焚光”状态：暴击伤害提高20%，攻击力提升28%，持续2回合，每3回合只能触发一次；在“焚光”状态下，普攻和重击每造成四次元素伤害，就使该状态延长1回合，至多延长1回合。夜魂加持状态下，“焚光”效果提高75%。","Using an Elemental Skill or Burst grants Scorching Brilliance for 2 turns, increasing CRIT DMG by 20% and ATK by 28%. This can trigger once every 3 turns. Every 4 instances of Elemental DMG from Normal or Heavy Attacks extend it by 1 turn, up to 1 extra turn. Nightsoul's Blessing increases its effects by 75%."]}},"3179":{"stats":{"BaseATK":46,"CritRate":0.072},"passive":{"name":["不灭的骑士道","Indomitable Chivalry"],"description":["普攻和重击AP消耗分别减少2/3点；普通攻击命中后/施放元素战技前/重击开始前分别获得1/2/2层“四风诗系”状态：造成的伤害提升7.5%，持续1回合，至多叠加4层；队伍拥有魔导·秘仪效果时，每层“四风诗系”额外提升7.5%暴击伤害。","Normal Attacks cost 2 less AP and Heavy Attacks cost 3 less AP. Gain 1 stack of Four Winds after a Normal Attack hits, or 2 before using an Elemental Skill or starting a Heavy Attack. Each stack grants 7.5% DMG for 1 turn, up to 4 stacks. While the party has Hexerei: Secret Rite, each stack also grants 7.5% CRIT DMG."]}},"3180":{"stats":{"BaseATK":48,"CritDMG":0.096},"passive":{"name":["白女皇的升变","White Fairy's Queening"],"description":["攻击力提升28%；重击每次命中后赋予自身“超越”状态：星超导反应伤害提升16%，持续1回合，至多叠加3层，每次伤害效果至多触发一次。","Gain 28% ATK. Heavy Attack hits grant Transcendence, increasing Stellar Superconduct DMG by 16% for 1 turn, up to 3 stacks. Each damage effect can trigger this once."]}},"3182":{"stats":{"BaseATK":48,"CritRate":0.048},"passive":{"name":["回响长天的诗歌","Echoing Ballad"],"description":["暴击伤害提高20%；攻击命中时有60%概率对随机一名被命中目标及其相邻目标造成一段125%攻击力的物理伤害，每6次伤害效果可以触发一次。","Gain 20% CRIT DMG. Hits have a 60% chance to deal 125% ATK as Physical DMG to one random enemy hit and its adjacent targets. This can trigger once every 6 damage effects."]}},"3183":{"stats":{"BaseATK":46,"RechargeBonus":0.12},"passive":{"name":["别离的思念之歌","The Parting Refrain"],"description":["元素精通提高60点；元素战技或元素爆发命中获得一层“追思之符”，获得4层后，消耗所有层数，使我方全体元素精通提高100点、攻击力提升20%，持续3回合；触发后5回合内无法再次获得追思之符。我方仅能从最新的状态中获得加成。","Gain 60 Elemental Mastery. Elemental Skill and Burst hits grant 1 Sigil of Remembrance. At 4 Sigils, consume them to grant the party 100 Elemental Mastery and 20% ATK for 3 turns. No new Sigils can be gained for 5 turns. The party receives only the latest bonus of this kind."]}},"3184":{"stats":{"BaseATK":46,"CritDMG":0.144},"passive":{"name":["飞雷御执","Rule by Thunder"],"description":["攻击力提高20%；持有1/2/3层“飞雷之巴印”时，普通攻击伤害提高12%/24%/40%。以下情况可获得一层“飞雷之巴印”：普攻造成伤害时，持续1回合；施放元素战技时，持续3回合；元素能量低于100%时。","Gain 20% ATK. At 1, 2, or 3 stacks of Thunder Emblem, Normal Attack DMG increases by 12%, 24%, or 40%, respectively. Gain 1 stack by dealing Normal Attack DMG for 1 turn, using an Elemental Skill for 3 turns, or having less than full Energy."]}},"3185":{"stats":{"BaseATK":46,"CritRate":0.072},"passive":{"name":["极昼的先兆者","Daylight's Augury"],"description":["元素战技和元素爆发伤害提高12%；普通攻击、重击、元素战技、元素爆发命中敌人后，可获得“白夜极星”状态：1/2/3/4层时攻击力提升10%/20%/30%/48%，持续3回合，各来源的该状态独立存在。","Gain 12% Elemental Skill and Burst DMG. When a Normal Attack, Heavy Attack, Elemental Skill, or Burst hits an enemy, gain an independent stack of Ashen Nightstar from that attack type for 3 turns. At 1, 2, 3, or 4 stacks, gain 10%, 20%, 30%, or 48% ATK, respectively."]}},"3186":{"stats":{"BaseATK":44,"CritDMG":0.192},"passive":{"name":["洗濯诸类之形","The Cleansing Form"],"description":["生命值提升16%，造成的伤害提升20%。","Gain 16% Max HP and deal 20% more DMG."]}},"3187":{"stats":{"BaseATK":44,"CritRate":0.096},"passive":{"name":["兽径的终点","At the End of the Beast-Paths"],"description":["获得12%所有元素伤害加成；重击命中后，获得“无休止的狩猎”状态：重击基础伤害值提高，提高值相当于元素精通的160%，持续3回合或生效12次后结束，每3回合至多触发一次。","Gain 12% All Elemental DMG Bonus. Heavy Attack hits grant Tireless Hunt, increasing Heavy Attack Base DMG by 160% of Elemental Mastery. It ends after 3 turns or 12 instances and can trigger once every 3 turns."]}},"3188":{"stats":{"BaseATK":46,"CritDMG":0.144},"passive":{"name":["伟大者帕西法尔","Parsifal the Great"],"description":["重击伤害提升16%；队伍中每存在一位同元素角色（包括自己），赋予装备者对应层数的“手法”，每存在一位不同元素的角色，赋予装备者对应层数的“演技”；1/2/3层“手法”使攻击力提升16%/32%/48%，1/2/3层“演技”使元素爆发伤害提升4%/7%/10%。","Gain 16% Heavy Attack DMG. For each party member of the wielder's element, including the wielder, gain 1 Gimmick stack. At 1, 2, or 3 stacks, gain 16%, 32%, or 48% ATK. For each party member of a different element, gain 1 Theatrics stack. At 1, 2, or 3 stacks, gain 4%, 7%, or 10% Burst DMG."]}},"3189":{"stats":{"BaseATK":44,"HPBonus":0.144},"passive":{"name":["德吕阿的夜曲","Dryas's Nocturne"],"description":["持有1/2/3层疗护时，生命值上限提升12%/24%/40%；拥有3层疗护时，元素爆发暴击率提升28%，此效果会在满层数降低后保留1回合。以下情况可获得一层疗护：施放元素战技时，持续6回合；生命之契的数值增加时，持续6回合；进行治疗时，持续5回合。疗护层数各自独立。","At 1, 2, or 3 Remedy stacks, gain 12%, 24%, or 40% Max HP. At 3 stacks, also gain 28% Elemental Burst CRIT Rate. The CRIT Rate bonus remains for 1 turn after dropping below 3 stacks. Gain 1 Remedy by using an Elemental Skill for 6 turns, increasing Bond of Life for 6 turns, or healing for 5 turns. Each stack has its own duration."]}},"3190":{"stats":{"BaseATK":46,"CritDMG":0.144},"passive":{"name":["眸中的月珥","The Moonring Sighted"],"description":["触发扩散反应后的3回合内，攻击力提高24%；队伍中存在至少1/2名不同元素角色时，重击伤害提升20%/48%，元素爆发伤害提升10%/24%。","After triggering Swirl, gain 24% ATK for 3 turns. With at least 1 or 2 party members of a different element, gain 20% or 48% Heavy Attack DMG and 10% or 24% Burst DMG, respectively."]}},"3191":{"stats":{"BaseATK":48,"CritDMG":0.096},"passive":{"name":["悠远的流颂之歌","Ode Beyond Time"],"description":["进入战斗后，普通攻击、元素战技和元素爆发伤害分别提升60%；战斗中我方每消耗1AP，该效果衰减0.4%，最低降至0。装备者造成上述攻击类型的伤害时，对应伤害类型增益增加10%，最多不超过原数值。队伍拥有魔导·秘仪效果时，增加值变为20%，且任一伤害命中都会同时增加3种效果数值。单次伤害效果只能触发一次。","At battle start, gain 60% Normal Attack, Elemental Skill, and Elemental Burst DMG. Each AP the party spends reduces these bonuses by 0.4%, down to 0%. Dealing damage of a listed type restores 10% of that type's bonus, up to its starting value, once per damage effect. With Hexerei: Secret Rite, the amount restored becomes 20% and any damage hit restores all three bonuses."]}},"3192":{"stats":{"BaseATK":44,"CritDMG":0.192},"passive":{"name":["与君致意的黎明","Dawn's Salutation Returned"],"description":["防御力提高16%；装备者的元素战技或月结晶伤害攻击命中后，赋予自身“霜妖精的报恩”状态：#6岩元素伤害#与月结晶反应伤害提升40%，持续2回合；上述状态持续时，若敌方场地存在月笼，我方其他角色获得“霜妖精的恶戏”状态：#6岩元素伤害#与月结晶反应伤害提升20%，装备者位于后台也能触发。","Gain 16% DEF. When the wielder lands an Elemental Skill or Lunar-Crystallize hit, gain Frost Sprite's Gift for 2 turns, increasing #6Geo# and Lunar-Crystallize DMG by 40%. While this is active and a Moon Cage exists on the enemy side, other allies gain Frost Sprite's Mischief, increasing their #6Geo# and Lunar-Crystallize DMG by 20%. This can trigger while the wielder is off-field."]}},"3193":{"stats":{"BaseATK":48,"CritRate":0.048},"passive":{"name":["昭理的鸢之枪","Eagle Spear of Justice"],"description":["命中敌人后，攻击力提高3.2%，持续2回合，至多叠加7层，每次伤害效果至多触发一次；满层时伤害提升12%。","Hitting enemies grants 3.2% ATK for 2 turns, up to 7 stacks. Each damage effect can trigger this once. At full stacks, deal 12% more DMG."]}},"3194":{"stats":{"BaseATK":48,"RechargeBonus":0.08},"passive":{"name":["斫断黑翼的利齿","Black Wing"],"description":["暴击率提升8%，普通攻击AP消耗-2；普通攻击与重击命中有50%概率触发真空刃，对随机一名被命中的敌方目标及其相邻目标造成一段40%攻击力的物理伤害，每1回合只能触发两次。","Gain 8% CRIT Rate and reduce Normal Attack AP cost by 2. Normal and Heavy Attack hits have a 50% chance to release a vacuum blade that deals 40% ATK as Physical DMG to one random enemy hit and its adjacent targets. This can trigger twice per turn."]}},"3195":{"stats":{"BaseATK":46,"ATKBonus":0.108},"passive":{"name":["金璋皇极","Golden Majesty"],"description":["护盾强效提升20%；攻击命中后2回合内攻击力提升4%，至多叠加5层，每次伤害效果只能触发一次；处于护盾庇护下时，该攻击力提升效果提高100%。","Gain 20% Shield Strength. Hits grant 4% ATK for 2 turns, up to 5 stacks. Each damage effect can trigger this once. The ATK bonus doubles while shielded."]}},"3196":{"stats":{"BaseATK":46,"CritDMG":0.144},"passive":{"name":["无羁的朱赤之蝶","Reckless Cinnabar"],"description":["生命值提升20%；基于装备者生命值上限的0.8%获得攻击力加成；生命值低于50%时进一步获得1%生命值上限的攻击力提升。","Gain 20% Max HP and ATK equal to 0.8% of Max HP. Below 50% HP, gain an additional 1% of Max HP as ATK."]}},"3197":{"stats":{"BaseATK":46,"RechargeBonus":0.12},"passive":{"name":["非时之梦·常世灶食","Timeless Dream: Eternal Stove"],"description":["攻击力获得提升，提升值相当于元素充能效率超过100%部分的28%，至多提升80%；施放元素爆发后3回合内元素充能效率提升30%。","Gain ATK equal to 28% of Energy Recharge above 100%, up to 80% ATK. After using an Elemental Burst, gain 30% Energy Recharge for 3 turns."]}},"3198":{"stats":{"BaseATK":49,"ATKBonus":0.036},"passive":{"name":["灭却之戒法","Extinguishing Precept"],"description":["获得12%所有元素伤害加成；施放元素战技后的5回合内，我方每消耗25AP，攻击力提升3.2%，至多叠加6层；装备者未上场时，该攻击力提升效果翻倍。","Gain 12% All Elemental DMG Bonus. For 5 turns after using an Elemental Skill, every 25 AP the party spends grants 3.2% ATK, up to 6 stacks. This ATK bonus doubles while the wielder is off-field."]}},"3199":{"stats":{"BaseATK":44,"CritRate":0.096},"passive":{"name":["蜃气尽头的热梦","Heat Haze at Horizon's End"],"description":["基于元素精通的52%获得攻击力加成；元素战技命中后，赋予自身“赤沙之梦”状态：基于元素精通的28%获得攻击力加成，持续3回合，至多叠加3层。","Gain ATK equal to 52% of Elemental Mastery. Elemental Skill hits grant Dream of the Scarlet Sands, increasing ATK by 28% of Elemental Mastery for 3 turns, up to 3 stacks."]}},"3200":{"stats":{"BaseATK":48,"CritRate":0.048},"passive":{"name":["烬日之影","Ashen Sun's Shadow"],"description":["重击命中时，赋予自身生命值上限25%的生命之契，每3回合至多触发一次；具有生命之契时，造成的伤害提升12%，若生命之契大于等于30%生命值上限，则造成的伤害进一步提升24%。","Heavy Attack hits grant a Bond of Life equal to 25% Max HP at most once every 3 turns. While the wielder has a Bond of Life, deal 12% more DMG. If it is at least 30% Max HP, deal an additional 24% more DMG."]}},"3201":{"stats":{"BaseATK":46,"CritRate":0.072},"passive":{"name":["白晓的序曲","Bright Dawn Overture"],"description":["攻击力提升15%；触发燃烧反应或对燃烧敌人造成#7草元素伤害#后，伤害提高18%，持续2回合，至多叠加2层；满层或满层刷新时恢复12点元素能量，此效果有3回合冷却。","Gain 15% ATK. Triggering Burning or dealing #7Dendro DMG# to a Burning enemy grants 18% DMG for 2 turns, up to 2 stacks. Reaching or refreshing full stacks restores 12 Energy, at most once every 3 turns."]}},"3202":{"stats":{"BaseATK":46,"CritDMG":0.144},"passive":{"name":["百味交响","Seasoned Symphony"],"description":["攻击力提升12%；未上场时攻击力额外提升12%；进行治疗后，装备者与被治疗角色攻击力提升32%，持续1回合，后台也能触发。","Gain 12% ATK and an additional 12% ATK while off-field. Healing grants the wielder and the healed character 32% ATK for 1 turn. This can trigger while off-field."]}},"3203":{"stats":{"BaseATK":46,"CritDMG":0.144},"passive":{"name":["洁霜的玉冕","Purifying Crown"],"description":["施放元素战技或元素爆发后的5回合内攻击力提升24%；期间若装备者创造了护盾，队伍触发的月感电反应伤害提升40%，持续5回合。","After using an Elemental Skill or Burst, gain 24% ATK for 5 turns. If the wielder creates a shield during this time, the party's Lunar-Charged DMG increases by 40% for 5 turns."]}},"3204":{"stats":{"BaseATK":48,"CritRate":0.048},"passive":{"name":["哀恸的赞礼","Mournful Tribute"],"description":["施放元素爆发后的1回合内月感电反应伤害提高36%；触发月感电后暴击伤害提高28%，持续2回合，并恢复12点元素能量，每3回合至多触发一次回能效果。","After using an Elemental Burst, gain 36% Lunar-Charged DMG for 1 turn. Triggering Lunar-Charged grants 28% CRIT DMG for 2 turns and restores 12 Energy. The Energy restoration can trigger once every 3 turns."]}},"3205":{"stats":{"BaseATK":48,"CritRate":0.048},"passive":{"name":["祸咎一击","Dolorous Stroke"],"description":["施放元素战技后获得4回合的“纷争之途”状态，和1回合的“无赦”及“无愈”状态，每4回合最多触发一次；“无赦”：普通攻击与重击伤害提升40%；“无愈”：元素战技与元素爆发伤害提升40%；“纷争之途”：持续期间，普攻和重击每命中2次，“无愈”延长1回合；元素战技和元素爆发每命中1次，“无赦”延长1回合；“纷争之途”结束或装备者下场将清除“无赦”及“无愈”状态。魔导·秘仪：上述伤害提升效果提高75%。","Using an Elemental Skill grants Path of Strife for 4 turns and Unforgiven and Unhealed for 1 turn, at most once every 4 turns. Unforgiven increases Normal and Heavy Attack DMG by 40%. Unhealed increases Elemental Skill and Burst DMG by 40 r Superconduct DMG, up to 3 stacks. At 3 stacks, also gain 12% All Elemental DMG Bonus."]}},"3211":{"stats":{"BaseATK":44,"WeaponEM":58},"passive":{"name":["千夜的曙歌","A Thousand Nights' Dawnsong"],"description":["我方其他角色元素精通提高40点；我方每位与装备者同元素的角色使装备者元素精通提升32点，不同元素的角色使装备者元素伤害提升10%，分别至多叠加3层。","Other allied characters gain 40 Elemental Mastery. For each other allied character of the wielder's element, the wielder gains 32 Elemental Mastery. Each other allied character of a different element grants 10% Elemental DMG Bonus. Each bonus stacks up to 3 times."]}},"3212":{"stats":{"BaseATK":48,"CritDMG":0.096},"passive":{"name":["堙没的蓝宝石泪滴","Bygone Azure Teardrop"],"description":["普通攻击AP消耗降低1点；施放元素战技后的4回合内，我方每消耗25AP，普通攻击伤害提升4.8%，普通攻击命中后，其伤害提升9.6%，通过上述两种方式至多提升48%；角色退场和再次施放元素战技时将先移除该效果。","Normal Attacks cost 1 less AP. For 4 turns after using an Elemental Skill, every 25 AP the party spends grants 4.8% Normal Attack DMG and each Normal Attack hit grants 9.6%. The total bonus is capped at 48%. Switching out or using the Elemental Skill again removes the existing effect."]}},"3213":{"stats":{"BaseATK":46,"HPBonus":0.108},"passive":{"name":["定土玉圭","Primordial Jade Regalia"],"description":["施放元素爆发或创造护盾后的1回合内，赋予自身“定土玉圭”状态：每回合我方回合开始和结束时恢复4点元素能量，每1000点生命值上限使自身获得0.3%元素伤害加成，至多提高12%，未出战时也能触发。","After using an Elemental Burst or creating a shield, gain Primordial Jade Regalia for 1 turn. Restore 4 Energy at the start and end of each allied turn. Each 1,000 Max HP grants 0.3% Elemental DMG Bonus, up to 12%. This can trigger while off-field."]}},"3214":{"stats":{"BaseATK":44,"CritDMG":0.192},"passive":{"name":["万世的浪涛","Aeon Wave"],"description":["生命值提升16%；生命值变化时，重击伤害提升14%，持续1回合，至多叠加3层，每次伤害效果只能触发一次；满层或刷新满层时恢复8点元素能量，每3回合至多触发一次回能效果。","Gain 16% Max HP. HP changes grant 14% Heavy Attack DMG for 1 turn, up to 3 stacks and at most once per damage effect. Reaching or refreshing full stacks restores 8 Energy, at most once every 3 turns."]}},"3215":{"stats":{"BaseATK":48,"CritRate":0.048},"passive":{"name ing an Elemental Skill or Burst grants Evening Glow for 4 turns, increasing Heavy Attack CRIT DMG by 40%. Both end after a Heavy Attack hits."]}},"3221":{"stats":{"BaseATK":44,"WeaponEM":58},"passive":{"name":["千年的祷咏歌","Millennial Hymn"],"description":["元素战技造成#2水元素#或#7草元素伤害#后，赋予自身“终北圣言”状态：元素精通提升60点，持续1回合；我方角色触发月绽放反应时，赋予自身“朔月诗篇”状态：元素精通提升60点，持续3回合；两状态同时存在时，我方全体绽放伤害提升120%、超绽放/烈绽放提升80%、月绽放提升40%。多个来自此武器的效果不叠加。","After dealing #2Hydro# or #7Dendro# Elemental Skill DMG, gain 60 Elemental Mastery for 1 turn. When an ally triggers Lunar-Bloom, gain 60 Elemental Mastery for 3 turns. While both effects are active, the party gains 120% Bloom DMG, 80% Hyperbloom and Burgeon DMG, and 40% Lunar-Bloom DMG. Multiple copies of this weapon cannot stack these party bonuses."]}},"3222":{"stats":{"BaseATK":44,"CritDMG":0.192},"passive":{"name":["伪言的真意","Essence of Falsity"],"description":["暴击率提升8%；施放元素战技时，赋予自身“伪言之秘”状态：元素精通提升80点，持续3回合；造成月绽放反应伤害时，赋予自身“真识之月”状态：暴击伤害提升24%，持续1回合；两状态同时存在时各提升50%效果。","Gain 8% CRIT Rate. Using an Elemental Skill grants 80 Elemental Mastery for 3 turns. Dealing Lunar-Bloom DMG grants 24% CRIT DMG for 1 turn. While both effects are active, each is 50% stronger."]}},"3223":{"stats":{"BaseATK":44,"CritDMG":0.192},"passive":{"name":["十字路的旅歌","Ballad of the Crossroads"],"description":["生命值上限提高10%；触发或造成月曜反应伤害时，恢复14点元素能量，并赋予自身“丰饶海的神酒”状态：生命值上限提高14%，月曜反应伤害暴击伤害提升60%，持续3回合。每5回合至多触发一次能量恢复效果。","Gain 10% Max HP. Triggering a Lunar Reaction or dealing Lunar Reaction DMG restores 14 Energy and grants 14% Max HP and 60% Lunar Reaction CRIT DMG for 3 turns. The Energy restoration can trigger once every 5 turns."]}},"3224":{"stats":{"BaseATK":49,"ATKBonus":0.036},"passive":{"name":["末临者的华冠","Crown of the Final Scion"],"description":["攻击力提升12%；创造护盾后，赋予自身“先导之光”状态：每1000点攻击力使当前场上角色伤害提升10%，上限26%，持续5回合；同时恢复14点元素能量，每4回合至多一次；队伍拥有魔导·秘仪效果时，我方其他未出战的魔导角色获得先导之光50%的伤害提升。","Gain 12% ATK. Creating a shield grants Guiding Light for 5 turns. For every 1,000 ATK the wielder has, the active character gains 10% DMG, up to 26%. Also restore 14 Energy, at most once every 4 turns. With Hexerei: Secret Rite, other off-field Hexerei characters gain 50% of Guiding Light's DMG bonus."]}}},"colors":["#FFD780","#FFA971","#08E4FF","#DEBAFF","#CFFFFF","#A6F7CF","#F5D761","#B1EB29","#FEFEFE"]}</script>

  <script>
  (() => {

      蒙德: "BattleBG/1_BG.png",

      稻妻: "BattleBG/3_BG.png",

      纳塔: "BattleBG/6_BG.png",
      挪德卡莱: "BattleBG/7_BG.png"
    };
    const weaponTypes = [
      ["单手剑", "Sword"], ["双手剑", "Claymore"], ["弓", "Bow"], ["长柄武器", "Polearm"], ["法器", "Catalyst"]
    ];
    const elementNames = {火: "Pyro", 水: "Hydro", 雷: "Electro", 冰: "Cryo", 风: "Anemo", 岩: "Geo", 草: "Dendro"};
    const byId = (id) => document.getElementById(id);
    const catalog = JSON.parse(byId("wish-pool-data").textContent);
    const schedule = JSON.parse(byId("wish-schedule-data").textContent);
    const orderedOpenings = Object.entries(schedule.openingStages)
      .sort(([aPhase,aStage],[bPhase,bStage]) => aStage-bStage || aPhase.localeCompare(bPhase,"en",{numeric:true}));
    let routeProgress = null;

    function card(id, stars, isCharacter = false) {
      const folder = isCharacter ? "Character" : "Weapon";
      const item = (isCharacter ? catalog.characters : catalog.weapons)[id];
      const [name, englishName, weaponType, nation, element] = item;
      const hasCard = !isCharacter || !catalog.portraitOnly.includes(id);
      const portrait = isCharacter && !hasCard ? "02" : isCharacter ? "04" : "01";
      const thumb = `${folder}_Icon/${id}_${portrait}.png`;
      return {
        id, name, englishName, stars, nation, element, weaponType, type: isCharacter ? "角色" : "武器",
        art: hasCard ? `${folder}_Bare/${id}_01.png` : null,
        thumb,
        upIcon: isCharacter ? `Character_Icon/${id}_02.png` : thumb
      };
    }
    const pools = {}, poolsByPhase = new Map(), phasesByVersion = new Map();
    const versionOf = phase => phase.slice(0, phase.lastIndexOf("."));
    for (const { id, phase, kind, title, englishTitle, five, four } of catalog.pools) {
      const isCharacter = kind === 0;
      pools[id] = {
        phase, title, englishTitle, featured: card(five, 5, isCharacter),
        up: four.map(item => card(item, 4, isCharacter))
      };
      if (!poolsByPhase.has(phase)) {
        poolsByPhase.set(phase, []);
        const version = versionOf(phase);
        if (!phasesByVersion.has(version)) phasesByVersion.set(version, []);
        phasesByVersion.get(version).push(phase);
      }
      poolsByPhase.get(phase).push(id);
    }
    const constantsByPhase = new Map(), cumulative = new Map();
    const phases = [...poolsByPhase.keys()].sort((a, b) => a.localeCompare(b, "en", { numeric: true }));
    for (const phase of phases) {
      for (const [kind, stars, ids] of catalog.constantAdditions[phase] ?? []) {
        for (const id of ids) cumulative.set(id, card(id, stars, kind === 0));
      }
      const phaseUps = new Set(poolsByPhase.get(phase).flatMap(id => [pools[id].featured, ...pools[id].up]).map(item => item.id));
      constantsByPhase.set(phase, [...cumulative.values()].filter(item => !phaseUps.has(item.id)));
    }
    const detailItems = new Map();
    for (const item of [...Object.values(pools).flatMap(pool => [pool.featured, ...pool.up]), ...cumulative.values()])
      detailItems.set(item.id, item);
    const wishRules = {
      角色: { fivePity: 90, fiveRate: 0.6, softStart: 74, softStep: 6, fourRate: 5.1 },
      武器: { fivePity: 80, fiveRate: 0.7, softStart: 63, softStep: 7, fourRate: 6 }
    };
    const fourPity = 10;
    const upRate = 75;
    let pityByType = {
      角色: { sinceFive: 0, sinceFour: 0, fourUpGuaranteed: false, fivePlan: null },
      武器: { sinceFive: 0, sinceFour: 0, fourUpGuaranteed: false, fivePlan: null }
    };
    let characterCopies = new Map();
    const wishRandomBuffer = new Uint32Array(1);
    const wishRandom = () => crypto.getRandomValues(wishRandomBuffer)[0] / 2 ** 32;

    function pauseRepeatWait() {
      if (!themeTimer) return;

    }

    function rememberThemePosition() {
      if (!themeFile) return;

    function syncTheme() {
      const featured = pools[activePool].featured;
      const file = featured.type === "角色" && featured.stars === 5 ? themeFiles[featured.id] : undefined;
      const shouldPlay = !!file && musicEnabled && hostVisible && infoView.hidden && !document.hidden;
      if (file !== themeFile || !shouldPlay) pauseRepeatWait();
      if (themeFade) {
        updateThemeButton(file);
        return;
      }
      if ((file !== themeFile || !shouldPlay) && !themeAudio.paused && !themeAudio.ended) {
        const started = performance.now();
        themeFade = setInterval(() => {
          const remaining = Math.max(0, 1 - (performance.now() - started) / themeFadeMs);
          fadeGain = remaining * remaining;
          applyThemeVolume();
          if (remaining > 0) return;
          clearInterval(themeFade);
          themeFade = null;
          themeAudio.pause();
          fadeGain = 1;
          applyThemeVolume();
          syncTheme();
        }, 25);
        updateThemeButton(file);
        return;
      }
      if (file !== themeFile) {
        rememberThemePosition();
        const bookmark = themeBookmarks.get(file);
        themeFile = file;
        repeatRemaining = bookmark?.wait ?? 0;
        gestureRequired = false;
        themeFailed = false;
        if (file) {
          themeAudio.src = "../soundtrack/BGM1/角色展示曲/" + encodeURIComponent(file);
          themeAudio.load();
          if (bookmark?.position > 0) themeAudio.currentTime = bookmark.position;
        } else {
          themeAudio.removeAttribute("src");
          themeAudio.load();
        }
      }
      updateThemeButton(file);
      if (!shouldPlay || themeFailed || gestureRequired || !themeAudio.paused) return;

      if (repeatRemaining > 0) {
        if (!themeTimer) {
          nextThemePlay = performance.now() + repeatRemaining;
          themeTimer = setTimeout(() => {
            themeTimer = null;
            repeatRemaining = 0;
            syncTheme();
          }, repeatRemaining);
        }
        return;
      }
      if (themeAudio.ended) themeAudio.currentTime = 0;
      const attemptedFile = themeFile;
      themeAudio.play().catch(error => {
        if (attemptedFile !== themeFile || error.name === "AbortError") return;
        gestureRequired = error.name === "NotAllowedError";
        themeFailed = !gestureRequired;
        updateThemeButton(themeFile);
      });
    }

    function bindFeaturedStrip(strip) {
      const prev = strip.querySelector('[data-featured-scroll="-1"]');
      const next = strip.querySelector('[data-featured-scroll="1"]');
      const track = strip.querySelector(".featured-track");
      if (track.scrollWidth - track.clientWidth <= 1) return;
      track.tabIndex = 0;
      track.classList.add("can-drag");

      const updateArrows = () => {
        prev.hidden = track.scrollLeft <= 1;
        next.hidden = track.scrollWidth - track.clientWidth - track.scrollLeft <= 1;
        if ((prev.hidden && document.activeElement === prev) || (next.hidden && document.activeElement === next))
          track.focus({preventScroll: true});
      };
      track.addEventListener("scroll", updateArrows, {passive: true});
      updateArrows();

      let drag = null;
      track.addEventListener("pointerdown", (event) => {
        if (drag || event.button !== 0 || event.pointerType === "touch") return;
        drag = { pointerId: event.pointerId, x: event.clientX, left: track.scrollLeft, moved: false };
      });
      track.addEventListener("pointermove", (event) => {
        if (drag?.pointerId !== event.pointerId) return;
        if (!drag.moved) {
          if (Math.abs(drag.x - event.clientX) < 5) return;
          drag.moved = true;
          track.setPointerCapture(event.pointerId);
          track.classList.add("is-dragging");
        }
        track.scrollLeft = drag.left + (drag.x - event.clientX) / fit;
      });
      const finishDrag = (event) => {
        if (drag?.pointerId !== event.pointerId) return;
        drag = null;
        track.classList.remove("is-dragging");
      };
      for (const type of ["pointerup", "pointercancel", "lostpointercapture"])
        track.addEventListener(type, finishDrag);
      track.addEventListener("pointerleave", (event) => {
        if (drag && !drag.moved) finishDrag(event);
      });
    }

      const records = history.filter((entry) => historyKind === "all" || entry.pool.featured.type === historyKind);
      const pageCount = Math.max(1, Math.ceil(records.length / historyPageSize));
      historyPage = Math.max(0, Math.min(historyPage, pageCount - 1));
      const end = records.length - historyPage * historyPageSize;
      const visible = records.slice(Math.max(0, end - historyPageSize), end).reverse();
      byId("history-rows").innerHTML = visible.map(({ reward, pool, drawnAt }) => `<tr>

        <td>${escapeDetail(poolTitle(pool))}</td><td><time datetime="${drawnAt.toISOString()}">${historyDate.format(drawnAt)}</time></td>
      </tr>`).join("");
      byId("history-count").textContent = text(`共 ${records.length} 条`,
        `${records.length} ${records.length === 1 ? "record" : "records"}`);

      byId("history-empty").hidden = records.length > 0;

      historyBody.querySelector('[data-history-page="1"]').disabled = historyPage >= pageCount - 1;

    function fiveRateAt(type, draw) {
      const { fivePity, fiveRate, softStart, softStep } = wishRules[type];
      return draw >= fivePity ? 100 : Math.min(100, fiveRate + Math.max(0, draw - softStart + 1) * softStep);
    }

    function nextWishRates(type, { sinceFive, sinceFour }) {
      const five = fiveRateAt(type, sinceFive + 1);
      const remaining = 100 - five;
      const four = sinceFour >= fourPity - 1 ? remaining
        : Math.min(remaining, wishRules[type].fourRate + (sinceFour === fourPity - 2 ? 50 : 0));
      return { five, four, three: Math.max(0, remaining - four) };
    }

    function planFive(type, forceUp, random) {
      let draw = 1;
      for (; draw < wishRules[type].fivePity; draw++) {
        const rate = fiveRateAt(type, draw);
        if (rate === 100 || random() * 100 < rate) break;
      }
      return { draw, isUp: forceUp || random() * 100 < upRate };
    }

    function drawReward(pool, random = wishRandom, states = pityByType) {
      const { type } = pool.featured;
      const pity = states[type];
      const constants = constantsByPhase.get(pool.phase);
      const pick = items => items[items.length === 1 ? 0 : Math.floor(random() * items.length)];
      pity.fivePlan ??= planFive(type, false, random);
      if (pity.sinceFive + 1 === pity.fivePlan.draw) {
        const offBanner = constants.filter(item => item.stars === 5 && item.type === type);
        const isUp = pity.fivePlan.isUp || offBanner.length === 0;
        const reward = isUp ? pool.featured : pick(offBanner);
        pity.sinceFive = 0;
        pity.sinceFour = Math.min(fourPity - 1, pity.sinceFour + 1);
        pity.fivePlan = planFive(type, !isUp, random);
        return reward;
      }
      const { four, three } = nextWishRates(type, pity);
      pity.sinceFive++;
      if (three === 0 || (four > 0 && random() * (four + three) < four)) {
        const offBanner = constants.filter(item => item.stars === 4);
        const isUp = offBanner.length === 0 || pity.fourUpGuaranteed || random() * 100 < upRate;
        pity.sinceFour = 0;
        pity.fourUpGuaranteed = !isUp;
        return pick(isUp ? pool.up : offBanner);
      }
      pity.sinceFour++;
      return pick(constants.filter(item => item.stars === 3));
    }

    function countCurrencies(rewards, copiesById = characterCopies) {
      let glitter = 0, dust = 0;
      for (const { id, type, stars } of rewards) {
        if (type === "角色") {
          const copies = copiesById.get(id) ?? 0;
          if (copies >= 7) glitter += stars === 5 ? 25 : 5;
          else if (copies > 0) glitter += stars === 5 ? 10 : 2;
          copiesById.set(id, copies + 1);
        } else if (stars === 3) {
          dust += 15;
        } else {
          glitter += stars === 5 ? 10 : 2;
        }
      }
      return { glitter, dust };
    }

    function showResultCurrencies({ glitter, dust }) {
      byId("result-glitter-amount").textContent = `×${glitter}`;
      byId("result-dust-amount").textContent = `×${dust}`;
      byId("result-glitter").hidden = glitter === 0;
      byId("result-dust").hidden = dust === 0;
      byId("result-currencies").hidden = glitter === 0 && dust === 0;
    }

    function makeSlot(reward, index) {
      return `<button class="slot" type="button" data-slot="${index}" data-stars="${reward.stars}"
          style="--entry-delay:${index * 25}ms" aria-label="${waitingSlotLabel(index)}" disabled>

          <span class="card-front">${art(reward)}</span>
          <img class="back-cover" src="${cardBack}" alt="">

    const waitingSlotLabel = (index) => text(`第 ${index + 1} 张卡，等待揭晓`, `Card ${index + 1}, awaiting reveal`);
    const revealedSlotLabel = (reward) => text(`${name(reward)}，${reward.stars} 星${reward.type}`,
