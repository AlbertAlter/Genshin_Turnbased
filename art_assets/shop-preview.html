<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>商店</title>
<style>
  @font-face {
    font-family: ProjectFont;
    src: url("UI/CharacterList/Font/zh-cn.ttf") format("truetype");
    font-weight: 400;
    font-display: swap;
  }
  :root {
    --deep: #716758;
    --light: #998f81;
    --paper: #f7efdd;
    --white: #fefefe;
    --ink: #352d25;
    --muted: #d8cbb7;
    --gold: #efcf8d;
    --line: #d8c6a34a;
    --frame: url("../art_assets/Character_Bare/Frame/01.png");
    --ui-font: ProjectFont, "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", system-ui, sans-serif;
    font: 400 24px/1.45 var(--ui-font);
    font-synthesis: none;
  }
  * { box-sizing: border-box; }
  body {
    display: grid;
    grid-template-rows: minmax(0, 1fr) auto;
    height: 100dvh;
    margin: 0;
    color: var(--paper);
    background: radial-gradient(ellipse at 68% 38%, #b4a797, transparent 68%), var(--deep);
  }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled { cursor: default; opacity: .46; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
  h1, h2, p { margin: 0; }
  h1, h2, strong, b { font-weight: 400; }
  img { display: block; object-fit: contain; }
  [hidden] { display: none !important; }

  .viewport { position: relative; min-height: 0; margin: 10px 12px 4px; overflow: hidden; }
  .canvas {
    position: absolute;
    width: 1920px;
    height: 1080px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%) scale(var(--scale, .5));
    background: linear-gradient(110deg, #a49989, var(--deep));
  }
  .store {
    position: absolute;
    inset: 25px 30px;
    isolation: isolate;
    display: grid;
    grid-template-rows: 100px minmax(0, 1fr);
    gap: 26px;
    padding: 28px 63px 44px;
    border-radius: 23px;
    overflow: hidden;
    background:
      linear-gradient(101deg, #493f34f7, #55493eeb 53%, #756758c4),
      url("../art_assets/BattleBG/1_BG.png") center / cover,
      var(--deep);
  }
  .store::after, .details::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 4;
    pointer-events: none;
    border: 64px solid transparent;
    border-image: var(--frame) 64 / 64px / 0 stretch;
  }
  .masthead {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 26px;
    border-bottom: 1px solid var(--line);
  }
  .identity { display: flex; align-items: center; gap: 22px; }
  .shop-return {
    flex: none;
    padding: 7px 14px;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: #3129216b;
    font-size: 20px;
  }
  .shop-return:hover { background: #f7efdd19; }
  .seal {
    display: grid;
    place-items: center;
    width: 52px;
    height: 52px;
    border: 1px solid #efcf8d68;
    transform: rotate(45deg);
  }
  .seal span { color: var(--gold); font-size: 33px; transform: rotate(-45deg); }
  h1 { color: var(--paper); font-size: 43px; letter-spacing: .15em; }
  .tabs {
    display: flex;
    gap: 7px;
    padding: 6px;
    border: 1px solid var(--line);
    border-radius: 36px;
    background: #3129216b;
  }
  .tabs button {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    width: 185px;
    height: 52px;
    padding: 0 14px;
    border: 0;
    border-radius: 28px;
    background: transparent;
    color: var(--muted);
    font-size: 23px;
  }
  html[lang="en"] .tabs button { width: auto; min-width: 176px; padding-inline: 18px; font-size: 20px; }
  .tabs button:hover { color: var(--white); background: #f7efdd19; }
  .tabs button[aria-pressed="true"] {
    color: var(--ink);
    background: linear-gradient(180deg, #f8efd9, #d7c6a9);
    box-shadow: inset 0 0 0 1px #fff7e3, 0 2px 6px #30251b67;
  }
  .tabs img, .balance img { width: 31px; height: 31px; }
  .balance {
    justify-self: end;
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 9px 19px;
    border: 1px solid var(--line);
    border-radius: 28px;
    background: #30282060;
    font-variant-numeric: tabular-nums;
  }
  .balance span { color: var(--muted); font-size: 17px; }
  .balance strong { font-size: 26px; }

  .content { display: grid; grid-template-columns: minmax(0, 1fr) 500px; gap: 38px; min-height: 0; }
  .catalog { display: grid; grid-template-rows: 56px minmax(0, 1fr); gap: 14px; min-height: 0; }
  .catalog-head { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
  .catalog-title { display: flex; align-items: baseline; gap: 16px; }
  .catalog-title h2 { font-size: 32px; letter-spacing: .06em; }
  .catalog-title h2::before { content: "◆"; color: var(--gold); font-size: 14px; vertical-align: .25em; margin-right: 12px; }
  html[lang="en"] #detailName { overflow-wrap: anywhere; }
  .catalog-title span { color: var(--muted); font-size: 18px; }
  .catalog-actions { display: flex; align-items: center; gap: 12px; }
  #search, #category {
    padding: 7px 16px;
    border: 1px solid var(--line);
    border-radius: 24px;
    background: #352d2566;
    font-size: 20px;
  }
  #search { width: 238px; }
  #search::placeholder { color: var(--muted); }
  #category { min-width: 145px; cursor: pointer; }
  #category option { color: var(--paper); background: #473e34; }
  .goods {
    display: grid;
    align-content: start;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    grid-auto-rows: max-content;
    gap: 19px 18px;
    overflow: auto;
    overscroll-behavior: contain;
    scrollbar-width: thin;
    scrollbar-color: #bfae8d #3e352d44;
    scrollbar-gutter: stable;
    padding: 5px 13px 8px 5px;
  }
  .tile {
    align-self: start;
    position: relative;
    display: block;
    min-width: 0;
    padding: 0;
    border: 1px solid #d8c6a36b;
    border-radius: 12px;
    overflow: hidden;
    background: #342a22ad;
    text-align: center;
    transition: box-shadow .14s, border-color .14s;
  }
  .tile:hover { border-color: #f3dfb5; }
  .tile[aria-pressed="true"] {
    border-color: #fff1cc;
    box-shadow: 0 0 0 3px #e3bf7aba, 0 4px 12px #352a21;
  }
  .tile:focus-visible { outline-offset: -4px; }
  .art {
    position: relative;
    display: grid;
    place-items: center;
    width: 100%;
    aspect-ratio: 1;
    overflow: hidden;
    background: var(--rarity, linear-gradient(#50545c, #858992)) center / cover no-repeat;
  }
  .art img { width: 84%; height: 84%; filter: drop-shadow(0 5px 7px #21191a45); }
  .art.weapon img { width: 96%; height: 96%; }
  .tile .art img { position: absolute; inset: 0; margin: auto; }
  .tile[aria-pressed="true"] .art::after {
    content: "";
    position: absolute;
    top: 10px;
    right: 10px;
    width: 9px;
    height: 9px;
    background: var(--white);
    box-shadow: 0 0 0 1px #443429;
    transform: rotate(45deg);
  }
  .tile.sold .art img { opacity: .46; }
  .stamp {
    position: absolute;
    top: 8px;
    left: 8px;
    padding: 1px 7px;
    border-radius: 5px;
    background: #312921db;
    color: var(--paper);
    font-size: 15px;
  }
  .stamp.sale { color: var(--gold); }
  .stars {
    color: #f5d58d;
    letter-spacing: .08em;
    text-shadow: 0 1px 3px #35261f;
  }
  .tile .stars { position: absolute; z-index: 1; top: -14px; font-size: 17px; line-height: 22px; }
  .value {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 5px;
    background: #f1e9d7;
    color: var(--ink);
    font-size: 20px;
    white-space: nowrap;
  }
  .tile .value { height: 37px; }
  .value img, .money img { width: 24px; height: 24px; }
  .value s { color: #716758; font-size: 15px; }
  .name {
    display: block;
    min-height: 31px;
    padding: 5px 7px;
    color: #f5ebd9;
    font-size: 17px;
    line-height: 21px;
    white-space: normal;
    overflow-wrap: anywhere;
  }
  .empty { grid-column: 1 / -1; padding-top: 155px; color: var(--muted); text-align: center; }

  .details {
    position: relative;
    isolation: isolate;
    display: grid;
    grid-template-rows: 302px minmax(0, 1fr) auto;
    padding: 20px 34px 30px;
    overflow: hidden;
    border-radius: 15px;
    background: radial-gradient(ellipse at 50% 19%, #bbaa9059, transparent 58%), #3d332bde;
  }
  .details::after { border-image-width: 34px; }
  .showcase { position: relative; display: grid; place-items: center; isolation: isolate; }
  .showcase::before {
    content: "";
    position: absolute;
    inset: 1px 14px 8px;
    z-index: -1;
    background: url("../art_assets/Others/PaimonEmblem_LightBrown.png") center / contain no-repeat;
    opacity: .24;
  }
  #detailArt { width: 226px; border: 1px solid #e9d6ae8c; border-radius: 15px; box-shadow: 0 12px 28px #251a1960; }
  .detail-copy { min-height: 0; text-align: center; }
  .details.weapon-details { grid-template-rows: 156px minmax(0, 1fr) auto; }
  .weapon-details #detailArt { width: 130px; }
  .weapon-details .detail-copy { display: flex; flex-direction: column; padding-bottom: 12px; }
  .weapon-details #detailName { font-size: 30px; }
  .weapon-preview { display: flex; flex: 1; flex-direction: column; min-height: 0; margin-top: 10px; }
  .weapon-modes {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
    margin-bottom: 11px;
  }
  .weapon-modes button {
    min-height: 38px;
    padding: 4px;
    border: 1px solid var(--line);
    border-radius: 20px;
    background: #30282060;
    font-size: 17px;
  }
  .weapon-modes button[aria-pressed="true"] { background: var(--paper); color: var(--ink); }
  .weapon-readout {
    min-height: 0;
    overflow: auto;
    padding: 0 8px 4px;
    scrollbar-width: thin;
    scrollbar-color: #bfae8d #3e352d44;
    text-align: left;
  }
  #weaponStats { display: grid; grid-template-columns: 1fr auto; gap: 5px 12px; margin: 0; font-size: 19px; }
  #weaponStats dt { color: var(--muted); }
  #weaponStats dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
  #weaponPassive {
    margin-top: 10px;
    padding-top: 9px;
    border-top: 1px solid var(--line);
    color: var(--paper);
    font-size: 19px;
    line-height: 1.55;
    white-space: pre-line;
  }
  #detailStars { font-size: 22px; min-height: 26px; }
  #detailName { color: var(--paper); font-size: 34px; }
  #detailInfo { margin: 12px auto 0; max-width: 370px; color: var(--muted); font-size: 20px; }
  .checkout { padding-top: 16px; border-top: 1px solid var(--line); font-size: 21px; }
  .checkout-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  .checkout-row span:first-child { color: var(--muted); }
  .money { display: inline-flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
  .money s { color: var(--muted); font-size: 17px; }
  .stepper { display: grid; grid-template-columns: 43px 72px 43px 60px; gap: 5px; text-align: center; }
  .stepper button, .stepper input {
    min-width: 0;
    height: 40px;
    padding: 0;
    border: 1px solid #d8c6a36b;
    border-radius: 7px;
    background: #b4a18c26;
    text-align: center;
  }
  .stepper input { appearance: textfield; background: #261d1770; }
  .stepper input::-webkit-inner-spin-button { appearance: none; }
  .stepper button { touch-action: manipulation; }
  .stepper button:hover:not(:disabled) { background: #b4a18c5c; }
  #exchange {
    width: 100%;
    height: 57px;
    margin-top: 8px;
    border: 1px solid #f7e6c1;
    border-radius: 30px;
    color: var(--ink);
    background: linear-gradient(#f8efda, #d8c7a9);
    box-shadow: inset 0 0 0 3px #f7efdd78;
    font-size: 24px;
    letter-spacing: .10em;
  }
  #exchange:hover:not(:disabled) { filter: brightness(1.08); }
  .tip {
    position: absolute;
    z-index: 5;
    top: 150px;
    left: 50%;
    transform: translateX(-50%);
    color: var(--white);
    font-size: 24px;
    text-shadow: 0 2px 6px #32281b;
    pointer-events: none;
  }
  .tip.active { animation: float-tip 1.75s ease both; }
  @keyframes float-tip {
    0% { opacity: 0; translate: 0 8px; }
    15%, 74% { opacity: 1; }
    100% { opacity: 0; translate: 0 -17px; }
  }
  .controls {
    min-height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px 16px;
    flex-wrap: wrap;
    padding: 4px 12px 8px;
    color: var(--paper);
    font: 400 13px/1.35 var(--ui-font);
  }
  .controls label { display: flex; align-items: center; gap: 8px; }
  .controls input, .controls select, .controls button {
    padding: 3px 9px;
    border: 1px solid #f7efdd61;
    border-radius: 5px;
    background: #473e34;
  }
  .controls input { width: 61px; }
  .controls output { min-width: 46px; font-variant-numeric: tabular-nums; }
  .controls details { position: relative; }
  .controls summary { cursor: pointer; }
  .controls details p {
    position: absolute;
    bottom: 26px;
    right: 0;
    z-index: 6;
    width: min(290px, 80vw);
    padding: 8px 12px;
    border-radius: 7px;
    background: #473e34;
    box-shadow: 0 3px 10px #21191b77;
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; }
    .tip.active { animation: none; }
  }
</style>
</head>
<body>
<div class="viewport" id="viewport">
  <main class="canvas" id="canvas" aria-label="商店" data-en-label="Shop">
    <section class="store">
      <header class="masthead">
        <div class="identity">
          <button type="button" class="shop-return" id="routeBack" hidden></button>
          <span class="seal" aria-hidden="true"><span>✦</span></span><h1 data-en="Shop">商店</h1>
        </div>
        <nav class="tabs" id="tabs" aria-label="选择商店" data-en-label="Select a shop"></nav>
        <div class="balance"><img id="balanceIcon" alt=""><span data-en="Balance">持有</span><strong id="balance"></strong></div>
      </header>
      <div class="content">
        <section class="catalog" aria-labelledby="catalogTitle">
          <div class="catalog-head">
            <div class="catalog-title"><h2 id="catalogTitle" data-en="Items">兑换一览</h2><span id="count"></span></div>
            <div class="catalog-actions">
              <select id="category" aria-label="按商品种类筛选" data-en-label="Filter by item type" hidden>
                <option value="" data-en="All Types">全部种类</option>
                <option value="0" data-en="Sword">单手剑</option>
                <option value="1" data-en="Claymore">双手剑</option>
                <option value="2" data-en="Bow">弓箭</option>
                <option value="3" data-en="Polearm">长枪</option>
                <option value="4" data-en="Catalyst">法器</option>
                <option value="material" data-en="Materials">材料</option>
              </select>
              <input id="search" type="search" placeholder="搜索商品" aria-label="搜索商品" data-en-label="Search items">
            </div>
          </div>
          <div class="goods" id="goods" aria-label="商品列表" data-en-label="Item list"></div>
        </section>
        <aside class="details" id="details" aria-label="商品详情" data-en-label="Item details">
          <div class="showcase"><div class="art" id="detailArt"><img id="detailIcon" alt=""></div></div>
          <div class="detail-copy">
            <div class="stars" id="detailStars"></div>
            <h2 id="detailName"></h2>
            <p id="detailInfo"></p>
            <div class="weapon-preview" id="weaponPreview" hidden>
              <div class="weapon-modes" id="weaponModes" role="group" aria-label="武器属性档位" data-en-label="Weapon level and refinement">
                <button type="button" data-weapon-mode="0" aria-pressed="true" data-en="Lv. 1 · R1">1级 · 精炼1阶</button>
                <button type="button" data-weapon-mode="1" aria-pressed="false" data-en="Lv. 90 · R5">90级 · 精炼5阶</button>
              </div>
              <div class="weapon-readout" id="weaponReadout" tabindex="0" aria-label="武器属性与效果" data-en-label="Weapon stats and effect">
                <dl id="weaponStats"></dl>
                <p id="weaponPassive"></p>
              </div>
            </div>
          </div>
          <div class="checkout" id="checkout">
            <div class="checkout-row"><span data-en="Unit Price">单价</span><strong class="money" id="unitPrice"></strong></div>
            <div class="checkout-row"><span data-en="Stock Left">剩余可兑换</span><strong id="stock"></strong></div>
            <div class="checkout-row">
              <span data-en="Quantity">兑换数量</span>
              <div class="stepper">
                <button type="button" id="minus" aria-label="减少兑换数量" data-en-label="Decrease quantity">−</button>
                <input type="number" id="quantity" aria-label="兑换数量" data-en-label="Quantity" min="1" step="1" value="1">
                <button type="button" id="plus" aria-label="增加兑换数量" data-en-label="Increase quantity">＋</button>
                <button type="button" id="max" data-en="Max">最大</button>
              </div>
            </div>
            <div class="checkout-row"><span data-en="Total">合计</span><strong class="money" id="total"></strong></div>
            <button type="button" id="exchange">确认兑换</button>
          </div>
        </aside>
      </div>
      <div class="tip" id="tip" role="status"></div>
    </section>
  </main>
</div>
<footer class="controls" aria-label="演示设置" data-en-label="Preview controls">
  <label><span data-en="Chapter">章节</span> <select id="chapter"></select></label>
  <label><span data-en="Node">节点</span> <input id="node" type="number" min="1" max="99" step="1" value="1"></label>
  <output id="nodeCode" for="chapter node">R601</output>
  <button type="button" id="reset" data-en="Reset Purchases">重置兑换</button>
  <button type="button" id="languageSwitch" lang="en" aria-label="Switch to English">EN</button>
  <details id="issues" hidden><summary id="issueCount"></summary><p id="issueText"></p></details>

    if (chapter < startChapter) return false;
    let distance = node % 100 - anchor % 100;
    for (let previous = startChapter; previous < chapter; previous++) {
      const length = data.chapterLengths[previous];
      if (length === undefined) return true;
      if (previous === startChapter && anchor % 100 > length) return false;
      distance += length;
      if (distance >= offset) return true;
    }
    return distance >= offset;
  }

  function offer(product) {
    let price = product.price;
    for (const rule of data.discounts[product.itemId] ?? [])
      if (reached(rule.node)) price += rule.delta;
    price = Math.max(0, price);
    let remaining = product.limit;
    if (remaining !== null) {
      for (const restock of product.restocks)
        if (reached(restock.anchor, restock.offset)) remaining += restock.amount;
      remaining = Math.max(0, remaining - (purchases[shop].get(product.id) ?? 0));
    }
    const max = Math.min(remaining ?? Number.MAX_SAFE_INTEGER,
      price > 0 ? Math.floor(balances[shop] / price) : Number.MAX_SAFE_INTEGER);
    return { product, price, remaining, max };
  }

  function image(path) {
    const element = document.createElement("img");
    element.src = assetRoot + path;
    element.alt = "";
    element.draggable = false;
    return element;
  }

  function text(tag, value, className) {
    const element = document.createElement(tag);
    element.textContent = value;
    if (className) element.className = className;
    return element;
  }

  function art(element, icon, product) {
    const names = { 1: "gray", 2: "green", 3: "blue", 4: "purple", 5: "gold" };
    const name = names[product.rarity];
    if (name)
      element.style.setProperty("--rarity", 'url("' + assetRoot + "RarityBackground/background_" + name + '.png")');
    else
      element.style.removeProperty("--rarity");
    element.classList.toggle("weapon", product.weapon);
    icon.src = assetRoot + product.icon;
  }

  function priceContents(container, value, oldPrice) {
    container.replaceChildren(image(currencyIcon()), text("b", format(value)));
    if (oldPrice > value) container.append(text("s", format(oldPrice)));
  }

  function tile(item) {
    const { product, price, remaining } = item;
    const button = document.createElement("button");
    button.type = "button";
    button.className = "tile" + (remaining === 0 ? " sold" : "");
    button.dataset.product = product.id;
    button.setAttribute("aria-pressed", String(selected === product.id));
    const name = productName(product);
    button.setAttribute("aria-label", name + tr("，", ", ") + format(price) + " " + tr(...shops[shop].unit));
    button.title = name;
    const graphic = document.createElement("span");
    graphic.className = "art";
    const icon = document.createElement("img");
    icon.alt = "";
    icon.draggable = false;
    icon.loading = "lazy";
    art(graphic, icon, product);
    graphic.append(icon);
    if (remaining === 0) graphic.append(text("span", tr("已兑完", "Sold Out"), "stamp"));
    else if (price < product.price) graphic.append(text("span", tr("折扣", "Sale"), "stamp sale"));
    else if (remaining !== null) graphic.append(text("span", tr("剩余 ", "Left ") + format(remaining), "stamp"));
    const value = document.createElement("span");
    value.className = "value";
    priceContents(value, price, product.price);
    value.append(text("span", "★".repeat(product.rarity), "stars"));
    button.append(graphic, value, text("span", name, "name"));
    return button;
  }

  function updateQuantity(item, amount) {
    quantity = item.max ? Math.max(1, Math.min(item.max, Math.trunc(amount) || 1)) : 0;
    $("quantity").value = quantity;
    $("quantity").min = item.max ? 1 : 0;
    $("quantity").max = item.max;
    $("quantity").disabled = !item.max;
    $("minus").disabled = quantity <= 1;
    $("plus").disabled = quantity >= item.max;
    $("max").disabled = quantity >= item.max;
    $("exchange").disabled = !item.max;
    $("exchange").textContent = item.remaining === 0
      ? tr("已兑完", "Sold Out")
      : item.max ? tr("确认兑换", "Confirm Exchange") : tr("货币不足", "Insufficient Currency");
    priceContents($("total"), item.price * quantity);
  }

  function renderWeapon(product) {
    const weapon = data.weapons[product.id];
    const panel = weapon.panels[weaponMode];
    for (const button of $("weaponModes").children)
      button.setAttribute("aria-pressed", String(Number(button.dataset.weaponMode) === weaponMode));
    const secondary = weapon.flat ? format(Math.round(panel.secondary)) : (panel.secondary * 100).toFixed(1) + "%";
    $("weaponStats").replaceChildren(text("dt", tr("基础攻击力", "Base ATK")), text("dd", format(Math.round(panel.attack))),
      text("dt", tr(weapon.secondaryName, weapon.secondaryNameEn)), text("dd", secondary));
    $("weaponPassive").textContent = tr(panel.description, panel.descriptionEn);
    $("weaponReadout").scrollTop = 0;
  }

  function itemDescription(product) {
    const template = data.experienceTexts[product.category];
    if (!template) return tr(product.description, product.descriptionEn);
    const amount = english ? format(product.experienceValue) : String(product.experienceValue);
    return tr(...template).replace("{0}", amount);
  }

  function renderDetail(item) {
    const isWeapon = item?.product.weapon === true;
    $("details").classList.toggle("weapon-details", isWeapon);
    $("weaponPreview").hidden = !isWeapon;
    $("detailInfo").hidden = isWeapon;
    $("checkout").hidden = !item;
    $("detailArt").hidden = !item;
    if (!item) {
      $("detailStars").textContent = "";
      $("detailName").textContent = tr("暂无商品", "No Items");
      $("detailInfo").textContent = "";
      return;
    }
    const { product, price, remaining } = item;
    art($("detailArt"), $("detailIcon"), product);
    $("detailName").textContent = productName(product);
    $("detailStars").textContent = "★".repeat(product.rarity);
    $("detailInfo").textContent = isWeapon ? "" : itemDescription(product);
    if (isWeapon) renderWeapon(product);
    $("stock").textContent = remaining === null ? tr("不限", "Unlimited") : format(remaining);
    priceContents($("unitPrice"), price, product.price);
    updateQuantity(item, quantity);
  }

  function displayed() {
    const query = $("search").value.trim().toLowerCase();
    const category = $("category").hidden ? "" : $("category").value;
    return data.products[shop].filter(product => {
      const type = product.weapon ? String(product.weaponType) : "material";
      return reached(product.opensAt) && (!category || type === category) &&
        (product.name.toLowerCase().includes(query) || product.nameEn.toLowerCase().includes(query));
    });
  }

  function selectedOffer() {
    const product = displayed().find(item => item.id === selected);
    return product ? offer(product) : null;
  }

  function render({ resetScroll = false, focus = false } = {}) {
    stopQuantityRepeat();
    for (const tab of $("tabs").children)
      tab.setAttribute("aria-pressed", String(Number(tab.dataset.shop) === shop));
    $("balanceIcon").src = assetRoot + currencyIcon();
    $("balance").textContent = format(balances[shop]);
    $("balance").parentElement.setAttribute("aria-label", tr("持有 ", "Balance: ") + format(balances[shop]) + " " + tr(...shops[shop].unit));
    $("category").hidden = shop === 2;
    const offers = displayed().map(offer);
    const groups = groupOrder[shop];
    const highestRarity = new Map();
    for (const { product } of offers) {
      const group = groupOf(product);
      highestRarity.set(group, Math.max(highestRarity.get(group) ?? 0, product.rarity));
    }
    offers.sort((a, b) => {
      const first = groupOf(a.product);
      const second = groupOf(b.product);
      return Number(a.remaining === 0) - Number(b.remaining === 0) ||
        highestRarity.get(second) - highestRarity.get(first) ||
        groups.indexOf(first) - groups.indexOf(second) ||
        b.product.rarity - a.product.rarity ||
        b.price - a.price;
    });
    if (!offers.some(item => item.product.id === selected)) {
      selected = offers[0]?.product.id ?? null;
      quantity = 1;
    }
    $("count").textContent = format(offers.length) + tr(" 件商品", offers.length === 1 ? " item" : " items");
    const grid = $("goods");
    const scrollTop = resetScroll ? 0 : grid.scrollTop;
    grid.replaceChildren(...offers.map(tile));
    if (!offers.length) grid.append(text("p", tr("没有符合条件的商品", "No matching items"), "empty"));
    grid.scrollTop = scrollTop;
    renderDetail(selectedOffer());
    if (focus) grid.querySelector('[aria-pressed="true"]')?.focus({ preventScroll: true });
  }

  function showTip(message) {
    const tip = $("tip");
    clearTimeout(tipTimeout);
    tip.classList.remove("active");
    tip.textContent = message;
    void tip.offsetWidth;
    tip.classList.add("active");
    tipTimeout = setTimeout(() => { tip.textContent = ""; }, 1750);
  }

  for (const [index, store] of shops.entries()) {
    const tab = document.createElement("button");
    tab.type = "button";
    tab.dataset.shop = index;
    tab.append(image("ItemIcon/" + store.currency + ".png"), text("span", tr(...store.names)));
    $("tabs").append(tab);
  }
  $("tabs").addEventListener("click", event => {
    const tab = event.target.closest("[data-shop]");
    if (!tab || Number(tab.dataset.shop) === shop) return;
    shop = Number(tab.dataset.shop);
    selected = null;
    quantity = 1;
    $("search").value = "";
    $("category").value = "";
    render({ resetScroll: true });
  });
  $("goods").addEventListener("click", event => {
    const button = event.target.closest("[data-product]");
    if (!button) return;
    stopQuantityRepeat();
    selected = button.dataset.product;
    quantity = 1;
    for (const cell of $("goods").querySelectorAll("[data-product]"))
      cell.setAttribute("aria-pressed", String(cell === button));
    renderDetail(selectedOffer());
  });
  $("weaponModes").addEventListener("click", event => {
    const button = event.target.closest("[data-weapon-mode]");
    const item = selectedOffer();
    if (!button || !item?.product.weapon) return;
    weaponMode = Number(button.dataset.weaponMode);
    renderWeapon(item.product);
  });
  $("search").addEventListener("input", () => render({ resetScroll: true }));
  $("category").addEventListener("change", () => render({ resetScroll: true }));
  $("quantity").addEventListener("change", event => {
    const item = selectedOffer();
    if (item) updateQuantity(item, Number(event.target.value));
  });
  let repeatDelay;
  let repeatInterval;
  let repeatedButton;

  function stopQuantityRepeat() {
    clearTimeout(repeatDelay);
    clearInterval(repeatInterval);
  }

  for (const [id, step] of [["minus", -1], ["plus", 1]]) {
    const button = $(id);
    const advance = () => {
      const item = selectedOffer();
      if (item) updateQuantity(item, quantity + step);
      if (!item || button.disabled) stopQuantityRepeat();
    };
    button.addEventListener("pointerdown", event => {
      if (!event.isPrimary || event.button !== 0) return;
      stopQuantityRepeat();
      repeatedButton = null;
      button.setPointerCapture(event.pointerId);
      repeatDelay = setTimeout(() => {
        repeatedButton = button;
        repeatInterval = setInterval(advance, 85);
        advance();
      }, 350);
    });
    for (const event of ["pointerup", "pointercancel", "lostpointercapture", "blur"])
      button.addEventListener(event, stopQuantityRepeat);
    button.addEventListener("click", event => {
      if (event.detail === 0 || repeatedButton !== button) advance();
      repeatedButton = null;
    });
  }
  window.addEventListener("blur", stopQuantityRepeat);
  $("max").addEventListener("click", () => {
    const item = selectedOffer();
    if (item) updateQuantity(item, item.max);
  });
  $("exchange").addEventListener("click", () => {
    const item = selectedOffer();
    if (!item || quantity < 1 || quantity > item.max) return;
    const { product, price } = item;
    const amount = quantity;
    purchases[shop].set(product.id, (purchases[shop].get(product.id) ?? 0) + amount);
    balances[shop] -= price * amount;
    quantity = 1;
    render({ focus: item.remaining !== amount });
    showTip(tr("已兑换 ", "Exchanged ") + productName(product) + " ×" + format(amount));
  });
  function updateNode(chapter, requested) {
    const max = data.chapterLengths[chapter] ?? 99;
    const stage = Math.max(1, Math.min(max, Math.trunc(requested) || 1));
    node = chapter * 100 + stage;
    chapterInput.value = chapter;
    nodeInput.max = max;
    nodeInput.value = stage;
    $("nodeCode").value = "R" + node;
  }

  chapterInput.addEventListener("change", () => {
    updateNode(Number(chapterInput.value), 1);
    quantity = 1;
    render({ resetScroll: true });
  });
  nodeInput.addEventListener("change", () => {
    updateNode(Number(chapterInput.value), nodeInput.valueAsNumber);
    quantity = 1;
    render({ resetScroll: true });
  });
  nodeInput.addEventListener("keydown", event => {
    if (event.key === "Enter") nodeInput.blur();
  });
  $("reset").addEventListener("click", () => {
    balances = shops.map(store => store.balance);
    purchases.forEach(ledger => ledger.clear());
    quantity = 1;
    render();
    showTip(tr("兑换记录已重置", "Purchases reset"));
  });
  if (data.errors.length) {
    $("issues").hidden = false;
    $("issueText").textContent = data.errors.join(" / ");
  }

  function applyLanguage() {
    document.documentElement.lang = tr("zh-CN", "en");
    document.title = tr("商店", "Shop");
    for (const [element, chinese] of localizedLabels)
      element.textContent = tr(chinese, element.dataset.en);
    for (const [element, chinese] of localizedAria)
      element.setAttribute("aria-label", tr(chinese, element.dataset.enLabel));
    $("search").placeholder = tr("搜索商品", "Search items");
    if (routeBackLabels) $("routeBack").textContent = tr(...routeBackLabels);
    [...$("tabs").children].forEach((tab, index) => { tab.lastElementChild.textContent = tr(...shops[index].names); });
    for (const option of chapterInput.options)
      option.textContent = tr("第 " + option.value + " 章", "Chapter " + option.value);
    $("issueCount").textContent = tr("配表校验 · ", "Data validation · ") + format(data.errors.length);
    const button = $("languageSwitch");
    button.textContent = tr("EN", "中文");
    button.lang = tr("en", "zh-CN");
    button.setAttribute("aria-label", tr("Switch to English", "切换到中文"));
  }

  $("languageSwitch").addEventListener("click", () => {
    english = !english;
    clearTimeout(tipTimeout);
    $("tip").textContent = "";
    applyLanguage();
    render();
  });

  function returnToRoute() {
    if (routeBackLabels) window.parent.postMessage({type:"route-app-back"},"*");
  }
  $("routeBack").addEventListener("click",returnToRoute);
  window.addEventListener("keydown",event=>{
    if (event.key==="Escape" && routeBackLabels && !event.defaultPrevented) returnToRoute();
  });
  window.addEventListener("message",event=>{
    if (window.parent===window || event.source!==window.parent || event.data?.type!=="shop-preview-context") return;
    const {chapter,stage,backLabel} = event.data;
    routeBackLabels = backLabel;
    $("routeBack").textContent = tr(...routeBackLabels);
    $("routeBack").hidden = false;
    updateNode(chapter,stage);
    render({resetScroll:true});
  });

  new ResizeObserver(([entry]) => {
    const { width, height } = entry.contentRect;
    $("canvas").style.setProperty("--scale", Math.min(width / 1920, height / 1080));
  }).observe($("viewport"));
  applyLanguage();
  updateNode(Math.floor(node / 100), node % 100);
  render();
</script>
</body>
</html>
