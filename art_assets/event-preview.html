  <main class="playground" aria-label="游戏画面">

      <span class="config-label" id="config-status">内嵌路线配置</span>
      <span class="tools-spacer"></span>
      <button id="demo-victory" type="button" disabled>演示胜利</button>
      <button id="demo-defeat" type="button" disabled>演示战败</button>
      <details id="trace-panel"><summary>流程记录</summary><ol id="trace-log"></ol></details>

      <span>战斗仅展示入战画面，结算由演示按钮触发</span></div>
  </footer>

const nodeLabels={Battle:'普通战斗',Event:'事件',Elite:'精英战斗',Boss:'首领战斗'};
function seededRandom(seed) {
  let value=Number(seed)>>>0;
  return ()=>{value+=0x6D2B79F5;let t=value;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};
}
function stageRows(rows) {
  const stages=rows.filter(r=>/^R\d+$/.test(String(r.StageID))).map(r=>{
    const s={id:String(r.StageID),min:Number(r.MinEncounter),max:Number(r.MaxEncounter),
      level:Number(r.EnemyLevel)||1,weights:Object.fromEntries(Object.keys(nodeLabels).map(k=>[k,Number(r[k])]))};
    if(!Number.isInteger(s.min)||!Number.isInteger(s.max)||s.min<1||s.max<s.min||
      Object.values(s.weights).some(w=>!Number.isFinite(w)||w<0)||
      !Object.values(s.weights).some(w=>w>0)) throw new Error('节点配置无效：'+s.id);
    return s;
  });
  if(!stages.length||new Set(stages.map(s=>s.id)).size!==stages.length)throw new Error('路线层配置为空或ID重复');
  return stages;
}
function weightedKind(weights,random) {
  const entries=Object.entries(weights).filter(([,w])=>w>0),total=entries.reduce((n,[,w])=>n+w,0);
  if(!total)throw new Error('节点总权重必须大于0');
  let value=random()*total;
  for(const[k,w]of entries){value-=w;if(value<0)return k;}
  return entries.at(-1)[0];
}
function generateRoute(stages,seed) {
  const random=seededRandom(seed),nodes=[],edges=[],columns=[];
  for(let stage=0;stage<stages.length;stage++){
    const config=stages[stage],count=config.min+Math.floor(random()*(config.max-config.min+1));
    const column=Array.from({length:count},(_,slot)=>{
      const node={id:config.id+':'+slot,stage,slot,kind:weightedKind(config.weights,random),
        x:165+stage*205,y:count===1?430:210+slot*450/(count-1)+(random()-.5)*35};
      nodes.push(node);return node;
    });columns.push(column);
  }
  const add=(a,b)=>{if(!edges.some(e=>e[0]===a.id&&e[1]===b.id))edges.push([a.id,b.id]);};
  for(let i=0;i<columns.length-1;i++){
    const a=columns[i],b=columns[i+1];
    for(let j=0;j<a.length;j++){
      const k=a.length===1?Math.floor((b.length-1)/2):Math.round(j*(b.length-1)/(a.length-1));
      add(a[j],b[k]);
      if(b[k+1]&&random()<.38)add(a[j],b[k+1]);
    }
    for(const node of b)if(!edges.some(e=>e[1]===node.id))
      add(a.reduce((near,n)=>Math.abs(n.y-node.y)<Math.abs(near.y-node.y)?n:near,a[0]),node);
  }
  return{nodes,edges,columns,width:330+(stages.length-1)*205};
}

  confirmFormation(){
    const party=(this.draft??[]).filter(Boolean);
    if(this.view!=='formation'||!party.length||party.length>4||new Set(party).size!==party.length)return false;
    this.party=party.slice();this.preset=this.draftPreset;this.presets[this.preset]=party.slice();
    this.log('SaveParty');this.battleParty=party.slice();this.view='battle';this.log('BeginBattle');return true;
  }
  resolveBattle(victory){
    if(this.view!=='battle')return false;
    if(!victory){this.view='defeat';this.log('BattleDefeatKeepBeforeBattle');return true;}
    this.view='settlement';
    this.pendingRewards=this.rewardRows.filter(r=>String(r.StageID)===this.stage.id)
      .map(r=>({id:String(r.ItemID),name:String(r.Name),quantity:Number(r.Quantity)}))
      .filter(r=>r.id&&Number.isFinite(r.quantity)&&r.quantity>0);
    this.log('RecordBattleVictory');return true;
  }
  commitVictory(){
    if(this.view!=='settlement')return false;
    const id=this.node.id;
    for(const r of this.pendingRewards)this.inventory.set(r.id,(this.inventory.get(r.id)??0)+r.quantity);
    this.visited.add(id);this.cursor=id;this.rewardOverlay=clone(this.pendingRewards);
    this.log('ReturnToRouteCommitReward');this.view='victory';this.log('PresentRewardOverlay');return true;
  }
  closeRewards(){this.rewardOverlay=null;this.log('CloseRewardDisplayOnly');}
  returnAfterVictory(){
    if(this.view!=='victory'||this.rewardOverlay!==null)return false;
    this.pending=null;this.view='route';this.log('ReturnToRouteScene');return true;
  }
}


// 页面只绑定模型和布局。没有调用旧网页，也不读写localStorage或Unity存档。

const $=selector=>document.querySelector(selector);
const command=(name,label,extra='',cls='btn')=>'<button type="button" class="'+cls+'" data-command="'+name+'" '+extra+'>'+label+'</button>';
const closeButton=()=>'<button type="button" class="page-close" data-command="back" aria-label="返回路线"><img src="'+asset('UI/Wish/WishCloseIcon.png')+'" alt=""></button>';
function header(title,context,close=true){

function cardImage(id,enemy=false){

const hero=id=>previewRoster.find(h=>h.id===id);
const nodeIcon=kind=>kind==='Boss'?'rouge/routeicon/boss_icon/2069.png':

function routePage(){
  const route=flow.route,available=flow.available(),byId=new Map(route.nodes.map(n=>[n.id,n]));
  const lines=route.edges.map(([a,b])=>{
    const x=byId.get(a),y=byId.get(b),done=flow.visited.has(a)&&(flow.visited.has(b)||available.includes(b));
    return'<path class="'+(done?'reached':'')+'" d="M '+x.x+' '+x.y+' C '+(x.x+90)+' '+x.y+' '+(y.x-90)+' '+y.y+' '+y.x+' '+y.y+'"/>';
  }).join('');
  const labels=route.columns.map((column,i)=>'<div class="stage-label" style="left:'+column[0].x+'px">第 '+(i+1)+' 层<small>'+esc(flow.stages[i].id)+'</small></div>').join('');
  const nodes=route.nodes.map(n=>{
    const can=available.includes(n.id)&&!flow.visited.has(n.id),visited=flow.visited.has(n.id),pending=flow.node?.id===n.id;
    const label=flow.stages[n.stage].id+' · '+nodeLabels[n.kind];
    return'<button class="map-node '+n.kind+(can?' available':'')+(visited?' visited':'')+(pending?' pending':'')+
      '" style="left:'+n.x+'px;top:'+n.y+'px" data-command="enter-node" data-node="'+esc(n.id)+'" aria-label="'+esc(label)+'" '+
      (can?'':'disabled')+'><img src="'+asset(nodeIcon(n.kind))+'" alt=""><span class="node-caption">'+esc(nodeLabels[n.kind])+'</span></button>';
  }).join('');
  const legend=['Battle','Event','Elite'].map(k=>'<span><img src="'+asset(nodeIcon(k))+'" alt="">'+nodeLabels[k]+'</span>').join('');
  return'<section class="scene route-scene" aria-label="路线图"><header class="route-header"><span class="title-diamond"></span><div><h1>'+text.route+
    '</h1><p>'+text.chapter+'</p></div><div class="route-stats">已完成 '+flow.visited.size+' 个节点<p>'+
    (flow.pending?'当前遭遇已保留':'沿相连的路径前进')+'</p></div></header>'+
    '<div class="route-scroll" tabindex="0" aria-label="横向路线图"><div class="route-map" style="width:'+route.width+'px">'+
    '<svg class="route-lines" width="'+route.width+'" height="780" aria-hidden="true">'+lines+'</svg>'+labels+nodes+'</div></div>'+
    '<footer class="route-footer"><div class="legend">'+legend+'</div><span class="route-help">'+
    (available.length?'点击亮起的节点 · 滚轮或拖动查看路线':'本章路线已完成 · 可在下方重新生成预览')+'</span>'+
    command('scroll-back','‹','aria-label="路线向左"','btn small')+command('scroll-forward','›','aria-label="路线向右"','btn small')+'</footer></section>';
}
function eventPage(){
  const event=flow.pending.occurrence,enemy=event.enemies[0],stage=flow.stage;
  return'<section class="scene event-scene" aria-label="事件遭遇">'+header(text.event,stage.id+' · 第 '+(flow.node.stage+1)+' 层')+
    '<div class="event-content"><figure class="event-art">'+portrait(enemy.id,true)+
    '<figcaption class="event-place">'+esc(event.place)+'</figcaption></figure>'+
    '<article class="event-copy"><p class="eyebrow">不期而遇</p><h1>'+esc(event.title)+'</h1><div class="flourish"></div>'+
    '<div class="story">'+event.paragraphs.map(p=>'<p>'+esc(p)+'</p>').join('')+'</div>'+
    '<div class="event-enemies"><span>遭遇敌人</span><span class="enemy-count">'+esc(enemy.name)+
    (event.enemies.length>1?' × '+event.enemies.length:'')+'</span><span>Lv. '+stage.level+'</span></div>'+
    '<div class="event-actions">'+command('accept-event','<span>'+esc(event.action)+'</span><span class="action-diamond"></span>','','btn primary')+
    command('leave-event',text.leave,'','btn leave')+'</div></article></div></section>';
}
function partySlot(id,index){
  const h=hero(id);
  if(!h)return'<div class="party-slot"><button class="art-card empty-slot" data-command="choose-slot" data-index="'+index+'" aria-label="选择第'+(index+1)+'位角色"><div><b>＋</b><span>选择角色</span></div></button><p class="level">位置 '+(index+1)+'</p></div>';
  return'<div class="party-slot"><button class="art-card" data-command="choose-slot" data-index="'+index+'" aria-label="更换'+esc(h.name)+'">'+
    '<span class="slot-index">'+(index+1)+'</span>'+cardImage(h.id)+'<span class="card-name">'+esc(h.name)+'</span></button>'+
    '<p class="level">Lv. '+h.level+'</p>'+command('remove-slot','移出','data-index="'+index+'"','remove')+'</div>';
}
function picker(){
  const quick=flow.picker===-1;
  const selected=quick?flow.picks:flow.draft;
  const cards=previewRoster.map(h=>{
    const at=selected.indexOf(h.id);
    return'<button class="roster-pick'+(at>=0?' selected':'')+'" data-command="pick-character" data-id="'+h.id+'" aria-label="选择'+h.name+'">'+
      '<img src="'+asset('Character_Bare/'+h.id+'_01.png')+'" alt="">'+(at>=0?'<b class="pick-number">'+(at+1)+'</b>':'')+'<span>'+h.name+'</span></button>';
  }).join('');
  return'<div class="overlay picker-overlay"><section class="picker" role="dialog" aria-modal="true" aria-label="'+(quick?'快速编队':'选择角色')+'">'+
    '<header class="picker-head"><h2>'+(quick?'快速编队':'选择第 '+(flow.picker+1)+' 位角色')+'</h2>'+
    command('close-picker','×','aria-label="关闭角色选择"','')+'</header><p>'+(quick?'按选择顺序安排队伍，最多四名角色。':'选择已在队伍中的角色时，将与当前卡位交换。')+'</p>'+
    '<div class="roster-grid">'+cards+'</div><footer class="picker-footer"><span>'+(quick?flow.picks.length+' / 4':'可选角色 '+previewRoster.length)+'</span>'+
    (quick?command('apply-quick','应用编队',flow.picks.length?'':'disabled','btn primary'):'')+'</footer></section></div>';
}
function formationPage(){
  const event=flow.pending.occurrence,count=flow.draft.filter(Boolean).length;
  return'<section class="scene formation-scene" aria-label="战前编队">'+header(text.formation,flow.stage.id+' · 第 '+(flow.node.stage+1)+' 层')+
    '<div class="formation-meta"><h2>'+esc(event.title)+'</h2><p>点击卡位选择角色，或用快速编队一次安排多个位置。</p>'+
    '<div class="preset-tabs" aria-label="十个编队预设">'+Array.from({length:10},(_,i)=>command('preset',String(i+1),'data-index="'+i+'" aria-label="编队'+(i+1)+'" aria-pressed="'+(i===flow.draftPreset)+'"',i===flow.draftPreset?'selected':'')).join('')+'</div></div>'+
    '<div class="party-board">'+Array.from({length:4},(_,i)=>partySlot(flow.draft[i],i)).join('')+'</div>'+
    '<footer class="formation-footer">'+command('back',text.back)+'<span class="push">'+count+' / 4</span>'+command('quick',text.quick)+
    command('confirm-formation',text.confirm,count?'':'disabled','btn primary')+'</footer>'+(flow.picker!==null?picker():'')+'</section>';
}
function battleCard(h,index,enemy){
  const level=enemy?flow.stage.level:h.level,hp=enemy?600+level*80:h.hp;
  return'<div class="battle-card'+(!enemy&&index===0?' active':'')+'">'+portrait(h.id,enemy,h.name)+
    '<div class="card-level">Lv. '+level+'</div><div class="hp-track"><div class="hp-fill"></div></div>'+
    '<div class="hp-text">'+hp.toLocaleString()+' / '+hp.toLocaleString()+'</div></div>';
}
function battlePage(){
  const event=flow.pending.occurrence;
  return'<section class="scene battle-scene" aria-label="战斗画面">'+header(event.title,flow.stage.id+' · Lv. '+flow.stage.level,false)+
    '<div class="battle-row enemies">'+event.enemies.map((e,i)=>battleCard(e,i,true)).join('')+'</div>'+
    '<div class="battle-divider">我方回合</div><div class="battle-row allies">'+flow.battleParty.map((id,i)=>battleCard(hero(id),i,false)).join('')+'</div>'+
    '<footer class="battle-bottom"><span>回合 1</span><span class="ap">行动点数 100 / 100</span><span class="skill-stub">普通攻击</span><span class="skill-stub">元素战技</span></footer>'+
    (flow.view==='victory'&&flow.rewardOverlay===null?'<div class="overlay"><section class="outcome"><h2>'+text.won+'</h2><p>奖励已获得，可以继续前进。</p>'+command('return-after-victory','返回路线','','btn primary')+'</section></div>':'')+
    (flow.view==='settlement'?'<div class="overlay"><div class="loading"><i></i><p>战斗胜利</p></div></div>':'')+'</section>';
}
function defeatPage(){
  return battlePage()+'<div class="overlay"><section class="outcome" role="dialog" aria-modal="true" aria-label="战斗失败"><h2>'+text.lost+
    '</h2><p>本次节点尚未完成。原遭遇与战前队伍均已保留，可以重新准备后再次挑战。</p><div class="buttons">'+
    command('back','返回路线')+command('retry-battle','重新编队','','btn primary')+'</div></section></div>';
}
function rewardOverlay(){
  const items=flow.rewardOverlay.map(r=>'<div class="reward-tile"><img src="'+asset('ItemIcon/'+r.id+'.png')+'" alt="'+esc(r.name)+'"><div class="reward-label">'+
    esc(r.name)+'<small>× '+r.quantity+'</small></div></div>').join('');
  return'<div class="overlay" data-command="close-rewards"><section class="outcome" role="dialog" aria-modal="true" aria-label="获得奖励"><h2>'+
    (items?'获得奖励':text.won)+'</h2><div class="reward-items">'+items+'</div>'+
    command('close-rewards','确认','','btn primary')+'</section></div>';
}
function scaleCanvas(){
  const rect=$('.playground').getBoundingClientRect();
  root.style.setProperty('--scale',Math.min(rect.width/1920,rect.height/1080));
}
new ResizeObserver(scaleCanvas).observe($('.playground'));

function render(){
  if(!flow)return;
  const scroller=root.querySelector('.route-scroll');
  if(scroller)routeScroll=scroller.scrollLeft;
  const view=flow.view;
  root.innerHTML=view==='route'?routePage():view==='event'?eventPage():view==='formation'?formationPage():
    view==='defeat'?defeatPage():battlePage();
  if(flow.rewardOverlay!==null)root.insertAdjacentHTML('beforeend',rewardOverlay());
  root.dataset.view=view;root.dataset.ready='true';
  const nextScroller=root.querySelector('.route-scroll');
  if(nextScroller){
    nextScroller.scrollLeft=routeScroll;
    if(lastCursor!==flow.cursor&&flow.cursor){
      const node=flow.route.nodes.find(n=>n.id===(flow.available()[0]??flow.cursor));
      nextScroller.scrollLeft=Math.max(0,node.x-400);
    }
    bindRouteDrag(nextScroller);
  }
  lastCursor=flow.cursor;
  if(lastView!==view)root.querySelector('.btn.primary')?.focus({preventScroll:true});
  lastView=view;
  $('#demo-victory').disabled=$('#demo-defeat').disabled=view!=='battle';
  const label={route:'路线图',event:'事件遭遇',formation:'战前编队',battle:'已进入战斗',defeat:'战败，节点保留',settlement:'胜利结算',victory:'战斗胜利，奖励已结算'}[view];
  $('#flow-status').textContent=label+(flow.node?' · '+flow.node.id:'');
  const next=flow.route.nodes.find(n=>n.id===flow.available()[0]);
  const s=flow.stages[flow.node?.stage??next?.stage??flow.stages.length-1],total=Object.values(s.weights).reduce((a,b)=>a+b,0);
  $('#weight-status').textContent=s.id+'：'+Object.entries(s.weights).filter(([,w])=>w>0).map(([kind,w])=>nodeLabels[kind]+' '+Math.round(w/total*100)+'%').join(' · ');
  $('#trace-log').innerHTML=flow.trace.slice(-24).map(t=>'<li>'+esc(t.command)+(t.node?' · '+esc(t.node):'')+'</li>').join('');
}
function bindRouteDrag(scroller){
  let drag=null;
  scroller.addEventListener('wheel',e=>{if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){e.preventDefault();scroller.scrollLeft+=e.deltaY;}},{passive:false});
  scroller.addEventListener('pointerdown',e=>{
    if(e.button!==0||e.target.closest('button'))return;
    drag={x:e.clientX,left:scroller.scrollLeft};scroller.setPointerCapture(e.pointerId);
  });
  scroller.addEventListener('pointermove',e=>{if(drag)scroller.scrollLeft=drag.left-(e.clientX-drag.x)/Math.min($('.playground').clientWidth/1920,$('.playground').clientHeight/1080);});
  for(const event of['pointerup','pointercancel'])scroller.addEventListener(event,()=>{drag=null;});
}
// 所有同名操作（鼠标、Esc、A/D）进入同一模型入口，一次点击只提交一次。
root.addEventListener('click',event=>{
  const b=event.target.closest('[data-command]');if(!b||b.disabled||!flow)return;
  if(b.classList.contains('overlay')&&event.target!==b)return;
  const action=b.dataset.command,index=Number(b.dataset.index);
  switch(action){
    case'enter-node':flow.enter(b.dataset.node);break;
    case'accept-event':flow.acceptEvent();break;
    case'leave-event':flow.leaveEvent();break;
    case'back':flow.cancel();break;
    case'preset':flow.selectPreset(index);break;
    case'choose-slot':flow.chooseSlot(index);break;
    case'remove-slot':flow.removeSlot(index);break;
    case'quick':flow.chooseSlot(-1);break;
    case'pick-character':flow.pick(Number(b.dataset.id));break;
    case'close-picker':flow.cancel();break;
    case'apply-quick':flow.applyQuick();break;
    case'confirm-formation':flow.confirmFormation();break;
    case'retry-battle':if(flow.view==='defeat')flow.openFormation();break;
    case'close-rewards':flow.closeRewards();break;
    case'return-after-victory':flow.returnAfterVictory();break;
    case'scroll-back':root.querySelector('.route-scroll')?.scrollBy({left:-650,behavior:'smooth'});return;
    case'scroll-forward':root.querySelector('.route-scroll')?.scrollBy({left:650,behavior:'smooth'});return;
    default:return;
  }
  render();
});
addEventListener('keydown',event=>{
  if(!flow||event.defaultPrevented||event.isComposing||event.target.matches('input,select,textarea'))return;
  if(event.key==='Escape'){
    event.preventDefault();if(flow.rewardOverlay!==null)flow.closeRewards();else flow.cancel();render();
  }else if(flow.view==='formation'&&flow.picker===null&&['a','A','d','D'].includes(event.key)){
    event.preventDefault();flow.selectPreset((flow.draftPreset+(['a','A'].includes(event.key)?9:1))%10);render();
  }
});
function demoResult(victory){
  if(!flow?.resolveBattle(victory))return;
  render();
  if(victory){
    const captured=flow;
    // HTML结果按钮代表战斗已结束。短暂显示结算过渡，再按Unity当前顺序
    // 先提交ReturnToRoute，留在战斗画面播放纯奖励浮层；关闭后开放返回路线。
    settlementTimer=setTimeout(()=>{if(flow===captured&&flow.commitVictory())render();},350);
  }
}
$('#demo-victory').addEventListener('click',()=>demoResult(true));
$('#demo-defeat').addEventListener('click',()=>demoResult(false));
$('#regenerate').addEventListener('click',()=>{
  if(!config)return;clearTimeout(settlementTimer);
  flow=new EventPreviewFlow({stages:config,seed:Number($('#seed').value)||0,events:previewEvents,roster:previewRoster,party:defaultParty,rewards:rewardRows});
  routeScroll=0;lastCursor=null;lastView=null;render();
});
// 配表快照与页面代码均已内嵌：直接打开HTML即可，不请求Excel、不等待网络。
// 后续修改源表不会自动影响本预览；需要时更新本段快照。Unity正式数据读取规则不变。
function initialize(){
  try{
    config=stageRows(previewStageRows);rewardRows=previewRewardRows;
    $('#config-status').textContent='内嵌配置 · Chapter1 · '+config.length+'层';
    $('#regenerate').click();
  }catch(error){
    root.dataset.ready='false';
    root.innerHTML='<section class="error-screen"><h1>预览初始化失败</h1><p>'+esc(error.message)+'</p></section>';
    $('#config-status').textContent='内嵌配置无效';
    $('#flow-status').textContent='初始化失败';
  }
}
scaleCanvas();initialize();

})();
  </script>
