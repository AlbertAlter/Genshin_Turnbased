<script>
const assets=JSON.parse(document.querySelector('#data').textContent),$=s=>document.querySelector(s);
let selected=null,trigger=null;
function a(label,path){if(!path)return document.createDocumentFragment();const el=document.createElement('a');el.textContent=label;el.href=path;el.target='_blank';return el}
function filter(){
 const terms=$('#search').value.trim().toLocaleLowerCase().split(/\s+/).filter(Boolean),cat=$('#category').value;
 const rows=assets.filter(e=>{const text=JSON.stringify([e.title,e.owner,e.variants.map(v=>v.name)]).toLocaleLowerCase();return (!cat||e.category===cat)&&terms.every(term=>text.includes(term))});
 $('#grid').replaceChildren();$('#count').textContent=`${rows.length} 项 · ${rows.reduce((s,e)=>s+e.variants.length,0)} 个展示`;$('#empty').style.display=rows.length?'none':'block';
 for(const e of rows){const item=document.createElement('article');item.className='item';const button=document.createElement('button');button.className='cover';button.setAttribute('aria-label',`查看${e.title}`);const cover=e.variants.map(v=>v.images[0]).find(Boolean);if(cover){const img=document.createElement('img');img.src=cover;img.loading='lazy';img.alt=e.title;button.append(img)}else{const text=document.createElement('span');text.textContent='静帧生成中';button.append(text)}const play=document.createElement('span');play.className='play';play.textContent=e.variants.some(v=>v.movieReady)?'查看动画':'查看源工程';button.append(play);button.onclick=()=>open(e,button);const info=document.createElement('div');info.className='info';const h=document.createElement('h2');h.textContent=e.title;const meta=document.createElement('div');meta.className='meta';meta.textContent=`${e.owner} · ${e.variants.length} 个展示`;const links=document.createElement('div');links.className='links';links.append(a('视觉需求',e.requirement),a('部件清单',e.manifest),a('音效来源',e.audioSource));info.append(h,meta,links);item.append(button,info);$('#grid').append(item)}
}
function stop(){ $('#player').pause();document.querySelectorAll('#sounds audio').forEach(a=>a.pause()) }
function change(){
 stop();const v=selected.variants[Number($('#variant').value)];$('#sound').disabled=v.mixedAudio===false;if($('#sound').disabled)$('#sound').checked=false;$('#sound').parentElement.lastChild.textContent=$('#sound').disabled?'独立音效见下方':'播放候选音效';if(v.movieReady)$('#player').src=v.movie;else{$('#player').removeAttribute('src');$('#player').load()}if(v.images[0])$('#player').poster=v.images[0];else $('#player').removeAttribute('poster');$('#player').muted=!$('#sound').checked;$('#videoError').style.display=v.movieReady?'none':'block';$('#phase').textContent=v.phase||(v.state?'出现 · 两次连续循环 · 退出':'完整动作与接触');$('#sourceLinks').replaceChildren(a(v.sourceLabel||'Blender 工程',v.source),a('视觉需求',selected.requirement),a('部件清单',selected.manifest),a('声音来源',selected.audioSource));$('#stills').replaceChildren();
 const labels=v.imageLabels||['整体','细节','斜视'],coverageLabels={'04_Single':'单一卡位范围','05_Adjacent':'相邻卡位连贯范围','06_Separated':'分散卡位范围','07_Clear':'范围全部清空'};
 const images=v.images.map((file,i)=>({file,label:labels[i]})).filter(row=>row.file).concat((v.coverage||[]).map(row=>({file:row.file,label:coverageLabels[row.label]||row.label})));
 for(const row of images){const block=document.createElement('div'),link=a('',row.file),img=document.createElement('img'),p=document.createElement('p');img.src=row.file;img.alt=row.label;img.loading='lazy';p.textContent=row.label;link.append(img);block.append(link,p);$('#stills').append(block)}
 $('#sounds').replaceChildren();for(const sound of v.sounds){const div=document.createElement('div'),small=document.createElement('small'),audio=document.createElement('audio');small.textContent=sound.name;audio.src=sound.file;audio.controls=true;audio.preload='none';audio.onplay=()=>{document.querySelectorAll('audio').forEach(other=>{if(other!==audio)other.pause()});$('#player').pause()};div.append(small,audio);$('#sounds').append(div)}
}
function open(entry,button){selected=entry;trigger=button;$('#title').textContent=entry.title;$('#variant').replaceChildren();entry.variants.forEach((v,i)=>{const option=document.createElement('option');option.value=i;option.textContent=v.name;$('#variant').append(option)});change();$('#detail').showModal()}
$('#search').oninput=filter;$('#category').onchange=filter;$('#variant').onchange=change;$('#sound').onchange=()=>$('#player').muted=!$('#sound').checked;$('#close').onclick=()=>$('#detail').close();$('#detail').onclose=()=>{stop();if(trigger)trigger.focus()};$('#detail').addEventListener('click',e=>{if(e.target===$('#detail')){const r=$('#detail').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('#detail').close()}});$('#player').onerror=()=>$('#videoError').style.display='block';filter();
</script>
